<!DOCTYPE html>
<html lang="tl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="style.css">
<title>👥 Mga Co-Admin</title>
<style>
.container{max-width:580px;margin:0 auto;padding:16px}
.card{background:white;padding:24px;border-radius:16px;box-shadow:0 2px 10px rgba(0,0,0,.08);margin-bottom:16px;border-left:4px solid #b91c1c}
h2{font-size:18px;margin:0 0 16px 0;color:#1f2937}
label{font-weight:bold;margin:12px 0 4px 0;display:block}
input,select{width:100%;padding:12px;border:2px solid #e5e7eb;border-radius:8px;font-size:15px}
input:focus,select:focus{outline:none;border-color:#b91c1c;box-shadow:0 0 0 3px rgba(185,28,28,0.12)}
.btn{padding:10px 18px;border:none;border-radius:8px;font-size:15px;font-weight:bold;cursor:pointer;margin-top:8px}
.btn-primary{background:linear-gradient(90deg,#b91c1c,#dc2626);color:white}
.btn-secondary{background:#e5e7eb;color:#1f2937;margin-left:6px}
.btn-danger{background:#dc2626;color:white}
.btn-small{padding:6px 10px;font-size:13px;margin:0 2px}
.item{display:flex;align-items:center;gap:10px;padding:14px;background:#fafafa;border-radius:10px;margin-top:8px;border-left:3px solid #b91c1c}
.item-info{flex:1}
.item-name{font-weight:bold;font-size:15px}
.item-role{font-size:13px;color:#6b7280;margin-top:2px}
.badge{padding:3px 10px;border-radius:12px;font-size:12px;font-weight:bold;margin-left:6px}
.badge.mod{background:#dbeafe;color:#1e40af}
.badge.editor{background:#fef3c7;color:#92400e}
.badge.full{background:#dcfce7;color:#166534}
.desc{background:#eff6ff;border-left:3px solid #3b82f6;padding:10px 14px;border-radius:6px;margin:10px 0;font-size:14px;color:#1e40af}
.status{padding:14px;border-radius:8px;margin-top:16px;display:none;font-weight:500}
.status.success{background:#dcfce7;color:#166534;display:block;border-left:4px solid #16a34a}
.form-area{background:#f9fafb;padding:16px;border-radius:12px;margin-top:10px}
</style>
</head>
<body>

<div class="nav-bar">
  <a href="admin-settings.html">⬅️ Bumalik</a>
  <a href="admin.html">🏠 Dashboard</a>
  <a href="admin-settings-coadmins.html" class="active">👥 Co-Admin</a>
</div>

<div class="container">
  <div class="card">
    <h2 id="form-title">➕ Magdagdag ng Co-Admin</h2>
    <div class="form-area">
      <input type="hidden" id="edit-idx" value="-1">
      <label>Pangalan:</label>
      <input type="text" id="ca-name" placeholder="Pangalan ng tao">
      <label>Katungkulan / Pahintulot:</label>
      <select id="ca-role" onchange="updateDesc()">
        <option value="mod">🔵 Moderator — Mag-edit lamang ng nilalaman</option>
        <option value="editor">🟡 Tagapamahala — Magdagdag at magbago ng pahina</option>
        <option value="full">🟢 Buong Pag-access — Gaya ng May-ari</option>
      </select>
      <div class="desc" id="role-desc">
        <strong>Moderator:</strong> Pwede lamang magbago ng laman sa loob ng <code>assets/pages/</code> — hindi maaaring baguhin ang iba pang bahagi.
      </div>
      <button class="btn btn-primary" onclick="saveEntry()">💾 I-save</button>
      <button class="btn btn-secondary" onclick="resetForm()">❌ Walang Baguhin</button>
    </div>
  </div>

  <div class="card">
    <h2>📋 Kasalukuyang Co-Admin</h2>
    <div id="list-here"><p style="color:#6b7280">Wala pang Co-Admin</p></div>
  </div>

  <div id="status-msg" class="status"></div>
</div>

<script>
const KEY = "bisyo_co_admins";
let list = [];

function load(){ list = JSON.parse(localStorage.getItem(KEY)||"[]"); render(); }
function save(){ localStorage.setItem(KEY, JSON.stringify(list)); render(); }

function roleLabel(r){
  return {mod:"🔵 Moderator",editor:"🟡 Tagapamahala",full:"🟢 Buong Pag-access"}[r]||r;
}
function updateDesc(){
  const r=document.getElementById("ca-role").value;
  const d=document.getElementById("role-desc");
  if(r==="mod")d.innerHTML="<strong>Moderator:</strong> Pwede lamang magbago ng laman sa <code>assets/pages/</code> — hindi maaaring baguhin ang iba.";
  else if(r==="editor")d.innerHTML="<strong>Tagapamahala:</strong> Pwede magdagdag at magbago ng pahina — pero hindi setting at co-admin.";
  else d.innerHTML="<strong>Buong Pag-access:</strong> Gaya ng May-ari — lahat ay maaaring baguhin.";
}
function resetForm(){
  document.getElementById("edit-idx").value="-1";
  document.getElementById("ca-name").value="";
  document.getElementById("ca-role").value="mod";
  updateDesc();
  document.getElementById("form-title").textContent="➕ Magdagdag ng Co-Admin";
}
function saveEntry(){
  const idx=parseInt(document.getElementById("edit-idx").value);
  const n=document.getElementById("ca-name").value.trim();
  const r=document.getElementById("ca-role").value;
  if(!n)return showMsg("❌ Ilagay ang pangalan","error");
  if(idx>=0){ list[idx]={name:n,role:r}; showMsg("✅ Na-update","success"); }
  else { list.push({name:n,role:r}); showMsg("✅ Naidagdag","success"); }
  save(); resetForm();
}
function editEntry(i){
  const a=list[i];
  document.getElementById("edit-idx").value=i;
  document.getElementById("ca-name").value=a.name;
  document.getElementById("ca-role").value=a.role;
  updateDesc();
  document.getElementById("form-title").textContent="✏️ I-edit Co-Admin";
}
function delEntry(i,n){
  if(!confirm(`Burahin si "${n}"?`))return;
  list.splice(i,1); save(); showMsg(`🗑️ Tinanggal: ${n}`,"info");
}
function render(){
  const c=document.getElementById("list-here");
  if(!list.length){c.innerHTML="<p style='color:#6b7280'>Wala pang Co-Admin</p>";return;}
  c.innerHTML=list.map((a,i)=>`
    <div class="item">
      <div class="item-info">
        <div class="item-name">${a.name}<span class="badge ${a.role}">${a.role==='mod'?'Moderator':a.role==='editor'?'Tagapamahala':'Buong'}</span></div>
        <div class="item-role">${roleLabel(a.role)}</div>
      </div>
      <div>
        <button class="btn btn-small btn-secondary" onclick="editEntry(${i})">✏️</button>
        <button class="btn btn-small btn-danger" onclick="delEntry(${i},'${a.name.replace(/'/g,"\\'")}')">🗑️</button>
      </div>
    </div>
  `).join("");
}
function showMsg(t,cls){const s=document.getElementById("status-msg");s.textContent=t;s.className=`status ${cls}`;s.style.display="block";setTimeout(()=>s.style.display="none",4000);}
window.onload=load;
</script>
</body>
</html>
