<!DOCTYPE html>
<html lang="tl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="style.css">
<title>Mga Setting</title>
<style>
.nav-bar{background:#1f2937;display:flex;flex-wrap:wrap;gap:4px;padding:8px 12px;position:sticky;top:0;z-index:100}
.nav-bar a{color:white;padding:8px 12px;border-radius:6px;text-decoration:none;font-size:14px}
.nav-bar a:hover,.nav-bar a.active{background:#b91c1c}
.container{max-width:550px;margin:0 auto;padding:16px}
.card{background:white;padding:24px;border-radius:16px;box-shadow:0 2px 10px rgba(0,0,0,.08);margin-bottom:16px}
h2{font-size:18px;margin:0 0 16px 0;color:#1f2937}
label{font-weight:bold;margin:16px 0 4px 0;display:block}
input{width:100%;padding:12px;border:2px solid #e5e7eb;border-radius:8px;font-size:15px}
.btn{padding:12px 24px;border:none;border-radius:8px;font-size:15px;font-weight:bold;cursor:pointer;margin-top:12px}
.btn-primary{background:linear-gradient(90deg,#b91c1c,#dc2626);color:white;width:100%}
.btn-danger{background:#fee2e2;color:#dc2626;width:100%}
.btn-secondary{background:#e5e7eb;color:#374151;width:100%}
.status{padding:14px;border-radius:8px;margin-top:16px;display:none}
.status.success{background:#dcfce7;color:#166534;display:block}
</style>
</head>
<body>

<div class="nav-bar">
  <a href="admin.html">🏠 Dashboard</a>
  <a href="admin-order.html">🔢 Ayusin Ayos</a>
  <a href="admin-edit.html">✏️ I-edit</a>
  <a href="admin-new-page.html">➕ Bagong Pahina</a>
  <a href="admin-pending.html">⏳ Nakabinbin</a>
  <a href="setup-token.html">🔧 Token</a>
  <a href="admin-settings.html" class="active">⚙️ Setting</a>
</div>

<div class="container">
  <div class="card">
    <h2>🔑 Palitan ang Password</h2>
    <label>Kasalukuyang Password:</label>
    <input type="password" id="current-pw">
    <label>Bagong Password:</label>
    <input type="password" id="new-pw">
    <label>Ulitin ang Bagong Password:</label>
    <input type="password" id="new-pw2">
    <button class="btn btn-primary" onclick="changePassword()">✅ Palitan ang Password</button>
  </div>

  <div class="card">
    <h2>🗑️ Linisin ang Lokal na Imbakan</h2>
    <p style="color:#6b7280">Burahin ang lahat ng naka-cache na pahina at nakabinbing pagbabago.</p>
    <button class="btn btn-danger" onclick="clearAllData()">🗑️ Linisin Lahat</button>
  </div>

  <div class="card">
    <h2>🚪 I-logout</h2>
    <p style="color:#6b7280">Tapusin ang kasalukuyang session sa lahat ng pahina.</p>
    <button class="btn btn-secondary" onclick="doLogout()">🚪 Logout</button>
  </div>

  <div id="status-msg" class="status"></div>
</div>

<script>
const SESSION_KEY = "bisyo_admin_session";

function checkSession() {
  const s = sessionStorage.getItem(SESSION_KEY);
  if (!s || Date.now() > JSON.parse(s).expiresAt) {
    alert("Nakalipas na ang session — mag-login muli");
    location.href = "admin.html";
    return false;
  }
  return true;
}

function getCurrentPassword() {
  const s = sessionStorage.getItem(SESSION_KEY);
  if (!s) return "";
  return JSON.parse(s).password || "";
}

function changePassword() {
  const cur = document.getElementById("current-pw").value;
  const newPw = document.getElementById("new-pw").value;
  const newPw2 = document.getElementById("new-pw2").value;

  if (cur !== getCurrentPassword()) return alert("❌ Mali ang kasalukuyang password");
  if (newPw.length < 4) return alert("❌ Masyadong maikli ang bagong password");
  if (newPw !== newPw2) return alert("❌ Hindi tugma ang bagong password");

  // ✅ I-update ang session
  const s = JSON.parse(sessionStorage.getItem(SESSION_KEY));
  s.password = newPw;
  sessionStorage.setItem(SESSION_KEY, JSON.stringify(s));

  showStatus("✅ NAPALITAN NA ANG PASSWORD — Gamitin na ito sa susunod", "success");
}

function clearAllData() {
  if (!confirm("⚠️ SIGURADO KA BA? Burahin ang lahat ng lokal na cache at nakabinbing pagbabago?")) return;
  localStorage.clear();
  showStatus("🗑️ Nilinis na ang lahat ng lokal na datos", "success");
}

function doLogout() {
  sessionStorage.removeItem(SESSION_KEY);
  location.href = "admin.html";
}

function showStatus(txt, cls) {
  const el = document.getElementById("status-msg");
  el.textContent = txt;
  el.className = `status ${cls}`;
}

window.onload = () => checkSession();
</script>
</body>
</html>
