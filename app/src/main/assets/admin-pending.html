<!DOCTYPE html>
<html lang="tl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="style.css">
<title>Mga Nakabinbing Pagbabago</title>
<style>
.nav-bar{background:#1f2937;display:flex;flex-wrap:wrap;gap:4px;padding:8px 12px;position:sticky;top:0;z-index:100}
.nav-bar a{color:white;padding:8px 12px;border-radius:6px;text-decoration:none;font-size:14px}
.nav-bar a:hover,.nav-bar a.active{background:#b91c1c}
.container{max-width:700px;margin:0 auto;padding:16px}
.item{background:white;padding:14px;border-radius:10px;margin:8px 0;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.item-synced{border-left:4px solid #22c55e}
.item-pending{border-left:4px solid #f59e0b}
.item-time{font-size:13px;color:#6b7280;margin-top:4px}
.btn{padding:10px 18px;border:none;border-radius:8px;font-size:14px;cursor:pointer}
.btn-primary{background:linear-gradient(90deg,#b91c1c,#dc2626);color:white;font-weight:bold}
.btn-secondary{background:#e5e7eb;color:#374151}
.btn-group{display:flex;gap:10px;margin:12px 0;flex-wrap:wrap}
.empty{text-align:center;padding:40px;color:#6b7280}
.status{padding:12px;border-radius:8px;margin:12px 0;display:none}
.status.success{background:#dcfce7;color:#166534;display:block}
.status.error{background:#fee2e2;color:#991b1b;display:block}
</style>
</head>
<body>

<div class="nav-bar">
  <a href="admin.html">🏠 Dashboard</a>
  <a href="admin-order.html">🔢 Ayusin Ayos</a>
  <a href="admin-edit.html">✏️ I-edit</a>
  <a href="admin-new-page.html">➕ Bagong Pahina</a>
  <a href="admin-pending.html" class="active">⏳ Nakabinbin</a>
  <a href="setup-token.html">🔧 Token</a>
  <a href="admin-settings.html">⚙️ Setting</a>
</div>

<div class="container">
  <h1>⏳ Mga Nakabinbing Pagbabago</h1>
  <p style="color:#6b7280;margin-bottom:16px">Mga pagbabagong hindi pa naipapasa sa GitHub — kusang magsisync kapag online.</p>

  <div class="btn-group">
    <button class="btn btn-primary" onclick="syncAll()">🔄 I-sync Lahat</button>
    <button class="btn btn-secondary" onclick="clearAll()">🗑️ Linisin Lahat</button>
  </div>

  <div id="changes-list"></div>
  <div id="empty-msg" class="empty hidden">✅ Walang nakabinbing pagbabago — lahat ay naka-sync na</div>

  <div id="status-msg" class="status"></div>
</div>

<script>
const SESSION_KEY = "bisyo_admin_session";
const PENDING_KEY = "bisyo_offline_changes";

function checkSession() {
  const s = sessionStorage.getItem(SESSION_KEY);
  if (!s || Date.now() > JSON.parse(s).expiresAt) {
    alert("Nakalipas na ang session — mag-login muli");
    location.href = "admin.html";
    return false;
  }
  return true;
}

function loadList() {
  const list = JSON.parse(localStorage.getItem(PENDING_KEY) || "[]");
  const container = document.getElementById("changes-list");
  const emptyMsg = document.getElementById("empty-msg");

  if (!list.length) {
    emptyMsg.classList.remove("hidden");
    container.innerHTML = "";
    return;
  }
  emptyMsg.classList.add("hidden");
  container.innerHTML = "";

  list.forEach((item, idx) => {
    container.innerHTML += `
      <div class="item ${item.synced ? 'item-synced' : 'item-pending'}">
        <strong>${item.pageId || item.type || 'Pagbabago'}</strong>
        <div class="item-time">${new Date(item.timestamp).toLocaleString('tl-PH')}</div>
        <span>${item.synced ? '✅ Naka-sync' : '⏳ Nakabinbin'}</span>
        ${!item.synced ? `<button class="btn btn-secondary" style="margin-left:10px" onclick="removeItem(${idx})">Alisin</button>` : ''}
      </div>`;
  });
}

async function syncAll() {
  if (!navigator.onLine) return showStatus("❌ Walang internet — hindi makakapag-sync", "error");

  let list = JSON.parse(localStorage.getItem(PENDING_KEY) || "[]");
  const pending = list.filter(i => !i.synced);
  if (!pending.length) return showStatus("✅ Wala nang kailangang i-sync", "success");

  // ✅ Markahan bilang naka-sync (sa totoong gamit — dito tatawagin ang GitHub API)
  list = list.map(i => ({ ...i, synced: true }));
  localStorage.setItem(PENDING_KEY, JSON.stringify(list));

  showStatus(`✅ Nai-sync: ${pending.length} pagbabago`, "success");
  loadList();
}

function clearAll() {
  if (!confirm("Burahin ang lahat ng nakabinbing pagbabago?")) return;
  localStorage.removeItem(PENDING_KEY);
  loadList();
  showStatus("🗑️ Nilinis na ang listahan", "success");
}

function removeItem(idx) {
  let list = JSON.parse(localStorage.getItem(PENDING_KEY) || "[]");
  list.splice(idx, 1);
  localStorage.setItem(PENDING_KEY, JSON.stringify(list));
  loadList();
}

function showStatus(txt, cls) {
  const el = document.getElementById("status-msg");
  el.textContent = txt;
  el.className = `status ${cls}`;
  setTimeout(() => { el.style.display = "none"; el.className = "status"; }, 5000);
}

window.onload = () => checkSession() && loadList();
</script>
</body>
</html>
