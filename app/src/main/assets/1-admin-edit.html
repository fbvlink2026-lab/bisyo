<!DOCTYPE html>
<html lang="tl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="style.css">
<title>✏️ I-edit ang Pahina — Visual + Code Editor</title>
<style>
/* ------ Espesipiko para sa Editor ------ */
.editor-tabs {
  display: flex; gap: 4px; margin: 12px 0; border-bottom: 2px solid #e5e7eb;
}
.editor-tab {
  padding: 10px 18px; background: #f3f4f6; border-radius: 8px 8px 0 0;
  border: none; font-weight: 600; font-size: 14px; cursor: pointer;
}
.editor-tab.active {
  background: white; border-bottom: 3px solid #b91c1c; color: #b91c1c;
}
.editor-pane { display: none; }
.editor-pane.active { display: block; }

/* ------ Visual Editor ------ */
#visualEditor {
  min-height: 380px; padding: 20px; border: 2px solid #d1d5db; border-radius: 10px;
  background: white; outline: none; font-size: 16px; line-height: 1.8;
}
#visualEditor:focus { border-color: #b91c1c; box-shadow: 0 0 0 3px rgba(185,28,28,0.1); }

/* ------ Toolbar ------ */
.toolbar {
  display: flex; flex-wrap: wrap; gap: 4px; padding: 8px;
  background: #f9fafb; border: 2px solid #d1d5db; border-bottom: none; border-radius: 10px 10px 0 0;
}
.tool-btn {
  padding: 6px 12px; background: white; border: 1px solid #e5e7eb; border-radius: 6px;
  font-size: 14px; cursor: pointer; transition: 0.2s;
}
.tool-btn:hover { background: #f3f4f6; border-color: #b91c1c; }
.tool-divider {
  width: 1px; background: #d1d5db; margin: 0 4px; display: inline-block;
}

/* ------ Code Editor ------ */
#codeEditor {
  width: 100%; min-height: 380px; padding: 16px;
  border: 2px solid #d1d5db; border-radius: 10px;
  font-family: 'Consolas', 'Monaco', monospace; font-size: 14px; line-height: 1.5;
  background: #1e293b; color: #e2e8f0; resize: vertical;
}
#codeEditor:focus { outline: none; border-color: #b91c1c; box-shadow: 0 0 0 3px rgba(185,28,28,0.15); }

/* ------ Preview ------ */
#previewFrame {
  width: 100%; height: 450px; border: 2px solid #d1d5db; border-radius: 10px;
  background: white;
}

/* ------ Pagpili ng File ------ */
.file-selector {
  margin: 12px 0; padding: 12px; background: #f9fafb; border-radius: 8px; border: 1px solid #e5e7eb;
}
.file-selector select {
  width: 100%; padding: 12px; border: 2px solid #d1d5db; border-radius: 8px;
  font-size: 15px; background: white;
}
.file-path {
  font-size: 13px; color: #6b7280; margin-top: 6px; font-family: monospace;
}

/* ------ Status ------ */
.status {
  padding: 12px 16px; border-radius: 8px; margin: 12px 0; display: none;
}
.status.show { display: block; }
.status.info { background: #eff6ff; color: #1e40af; border-left: 3px solid #3b82f6; }
.status.success { background: #dcfce7; color: #166534; border-left: 3px solid #22c55e; }
.status.error { background: #fee2e2; color: #b91c1c; border-left: 3px solid #ef4444; }

/* ------ Buttons ------ */
.btn-row { display: flex; gap: 10px; flex-wrap: wrap; margin: 12px 0; }
.btn {
  padding: 12px 20px; border-radius: 10px; font-size: 15px; font-weight: bold;
  border: none; cursor: pointer; transition: 0.2s;
}
.btn-primary { background: linear-gradient(90deg, #b91c1c, #dc2626); color: white; }
.btn-primary:hover { transform: translateY(-2px); }
.btn-primary:disabled { background: #9ca3af; cursor: not-allowed; transform: none; }
.btn-secondary { background: #e5e7eb; color: #1f2937; }
.btn-secondary:hover { background: #d1d5db; }
</style>
</head>
<body>

<!-- ☰ MENU -->
<button class="menu-toggle" id="menuToggle" onclick="toggleMenu()">☰</button>
<div class="overlay" id="overlay" onclick="closeMenu()"></div>

<div class="sidebar" id="sidebar">
  <a href="admin-settings.html">🏠 Dashboard</a>
  <span class="menu-section">Pamamahala</span>
  <a href="admin-settings-coadmins.html">👥 Co-Admin</a>
  <a href="admin-menu-order.html">🔢 Ayusin Ayos ng Menu</a>
  <a href="admin-order.html">📄 Ayusin Nilalaman</a>
  <a href="admin-edit.html" class="active">✏️ I-edit ang Pahina</a>
  <a href="admin-new-page.html">➕ Bagong Pahina / File</a>
  <a href="admin-styles.html">🎨 Estilo — style.css</a>
  <span class="menu-section">Sistema</span>
  <a href="setup-token.html">🔧 I-setup ang Token</a>
  <a href="#" onclick="logout();return false;">🚪 Mag-logout</a>
</div>

<!-- 📋 NILALAMAN -->
<div class="page-content">
  <a href="admin-settings.html" class="back-link">← Bumalik sa Dashboard</a>

  <div class="card">
    <h2>✏️ I-edit ang Pahina o File</h2>

    <!-- Status -->
    <div id="status" class="status"></div>

    <!-- Pagpili ng File -->
    <div class="file-selector">
      <label style="font-weight:bold; display:block; margin-bottom:8px;">Piliin ang Pahina / File:</label>
      <select id="fileSelect" onchange="loadSelectedFile()">
        <option value="">— Pumili muna —</option>
        <optgroup label="Admin Pages">
          <option value="admin.html">admin.html — Pag-login</option>
          <option value="admin-settings.html">admin-settings.html — Dashboard</option>
          <option value="admin-menu-order.html">admin-menu-order.html — Ayos ng Menu</option>
          <option value="admin-edit.html">admin-edit.html — Pahinang Ito</option>
          <option value="admin-new-page.html">admin-new-page.html — Bagong File</option>
          <option value="admin-styles.html">admin-styles.html — Estilo</option>
        </optgroup>
        <optgroup label="Pangunahing Pahina">
          <option value="main.html">main.html — Pangunahing Pahina</option>
        </optgroup>
        <optgroup label="Iba pa">
          <option value="style.css">style.css — Estilo</option>
        </optgroup>
      </select>
      <div class="file-path" id="filePathDisplay"></div>
    </div>

    <!-- Toolbar — Para sa Visual Editor -->
    <div id="visualToolbar" class="toolbar" style="display:none;">
      <button class="tool-btn" onclick="execCmd('bold')" title="Matapang">B</button>
      <button class="tool-btn" onclick="execCmd('italic')" title="Nakatuwid">I</button>
      <button class="tool-btn" onclick="execCmd('underline')" title="Salungguhit">U</button>
      <span class="tool-divider"></span>
      <button class="tool-btn" onclick="execCmd('insertUnorderedList')" title="Listahan">•</button>
      <button class="tool-btn" onclick="execCmd('insertOrderedList')" title="Bilang">1.</button>
      <span class="tool-divider"></span>
      <button class="tool-btn" onclick="insertLink()" title="Ipasok ang Link">🔗</button>
      <button class="tool-btn" onclick="insertImage()" title="Ipasok ang Larawan">🖼️</button>
      <span class="tool-divider"></span>
      <button class="tool-btn" onclick="formatBlock('h2')">Pamagat</button>
      <button class="tool-btn" onclick="formatBlock('p')">Talata</button>
      <span class="tool-divider"></span>
      <button class="tool-btn" onclick="undo()">↩️ Bawiin</button>
      <button class="tool-btn" onclick="redo()">↪️ Ulitin</button>
    </div>

    <!-- Tab — Pumili ng Uri ng Editor -->
    <div class="editor-tabs">
      <button class="editor-tab active" onclick="switchTab('visual')">👁️ Visual Editor</button>
      <button class="editor-tab" onclick="switchTab('code')">⌨️ Code Editor</button>
      <button class="editor-tab" onclick="switchTab('preview')">📺 Tingnan</button>
    </div>

    <!-- Editor — Visual -->
    <div id="pane-visual" class="editor-pane active">
      <div id="visualEditor" contenteditable="true" placeholder="Simulan ang pagsusulat dito..."></div>
    </div>

    <!-- Editor — Code -->
    <div id="pane-code" class="editor-pane">
      <textarea id="codeEditor" placeholder="<!-- Ilagay ang HTML dito -->"></textarea>
    </div>

    <!-- Preview -->
    <div id="pane-preview" class="editor-pane">
      <iframe id="previewFrame" title="Preview"></iframe>
    </div>

    <!-- Mga Pindutan -->
    <div class="btn-row">
      <button class="btn btn-secondary" onclick="refreshPreview()">🔄 I-refresh ang Tingnan</button>
      <button class="btn btn-secondary" onclick="loadFromGitHub()">📤 Kunin mula sa GitHub</button>
      <button class="btn btn-primary" id="saveBtn" onclick="saveToGitHub()">💾 I-save sa GitHub</button>
    </div>
  </div>
</div>

<!-- 🔐 SISTEMA — PAREHO SA LAHAT -->
<script>
const REPO_OWNER = "fbvlink2026-lab";
const REPO_NAME  = "bisyo";
const BRANCH     = "main";

let currentFile = null;
let currentSha  = null;
let activeTab   = "visual";

// ☰ MENU
function toggleMenu(){
  const sb=document.getElementById("sidebar"), ov=document.getElementById("overlay");
  sb.classList.toggle("open"); ov.classList.toggle("open");
}
function closeMenu(){
  document.getElementById("sidebar").classList.remove("open");
  document.getElementById("overlay").classList.remove("open");
}
document.addEventListener("click",e=>{ if(e.target.closest(".sidebar a")) closeMenu(); });

// 🔐 SEGURIDAD
async function getKey(password){
  const enc=new TextEncoder(), salt=new TextEncoder().encode("bisyo-fixed-salt-v1");
  const mat=await crypto.subtle.importKey("raw", enc.encode(password), {name:"PBKDF2"}, false, ["deriveKey"]);
  return await crypto.subtle.deriveKey(
    {name:"PBKDF2", salt:salt, iterations:150000, hash:"SHA-256"},
    mat, {name:"AES-GCM", length:256}, false, ["encrypt","decrypt"]
  );
}
async function decryptAES(encrypted, password){
  try{
    const key=await getKey(password);
    const all=Uint8Array.from(atob(encrypted),c=>c.charCodeAt(0));
    const dec=await crypto.subtle.decrypt({name:"AES-GCM", iv:all.subarray(0,12)}, key, all.subarray(12));
    return new TextDecoder().decode(dec);
  }catch{return null;}
}
async function getToken(){
  const encrypted=localStorage.getItem("bisyo_encrypted_token");
  if(!encrypted){ showStatus("❌ Walang Token — Mag-login ulit", "error"); return null; }
  const pass=sessionStorage.getItem("bisyo_admin_session");
  if(!pass){ showStatus("❌ Hindi naka-login", "error"); location="admin.html"; return null; }
  const token=await decryptAES(encrypted, atob(pass));
  if(!token){ showStatus("❌ Maling Password — Mag-login ulit", "error"); logout(); return null; }
  return token;
}
function isLoggedIn(){ return !!sessionStorage.getItem("bisyo_admin_session"); }
function requireLogin(){ if(!isLoggedIn()){ alert("❌ Kailangan mag-login"); location="admin.html"; return false; } return true; }
function logout(){
  sessionStorage.removeItem("bisyo_admin_session");
  localStorage.removeItem("bisyo_remember");
  location="admin.html";
}

// 📌 TULONG — MENSAHE
function showStatus(text, type="info"){
  const el=document.getElementById("status");
  el.textContent=text;
  el.className=`status ${type} show`;
  setTimeout(()=>el.classList.remove("show"), 8000);
}

// ==================================================
// 📂 HAKBANG — PUMILI NG FILE
// ==================================================
function loadSelectedFile(){
  const sel=document.getElementById("fileSelect").value;
  if(!sel){
    currentFile=null; currentSha=null;
    document.getElementById("filePathDisplay").textContent="";
    document.getElementById("visualEditor").innerHTML="";
    document.getElementById("codeEditor").value="";
    return;
  }
  currentFile=sel;
  document.getElementById("filePathDisplay").textContent=`📁 ${sel}`;
  loadFromGitHub();
}

// ==================================================
// 📤 HAKBANG — KUNIN MULA SA GITHUB
// ==================================================
async function loadFromGitHub(){
  if(!requireLogin()) return;
  if(!currentFile){ showStatus("❌ Pumili muna ng file", "error"); return; }
  const token=await getToken();
  if(!token) return;

  showStatus(`📤 Kinukuha ang ${currentFile}...`, "info");

  try{
    const res=await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${currentFile}?ref=${BRANCH}`, {
      headers: {"Authorization": `token ${token}`}
    });
    if(res.status===404){
      showStatus(`ℹ️ Wala pang ${currentFile} — gagawa ng bago`, "info");
      currentSha=null;
      document.getElementById("visualEditor").innerHTML = "";
      document.getElementById("codeEditor").value = "";
      return;
    }
    if(!res.ok) throw new Error(`HTTP ${res.status}`);
    const data=await res.json();
    currentSha=data.sha;
    const content=atob(data.content);

    // Ipakita sa Editor
    if(isTextFile(currentFile)){
      document.getElementById("codeEditor").value=content;
      if(isHtmlFile(currentFile)){
        // Kunin ang <body> lang para sa Visual Editor
        const bodyMatch=content.match(/<body\b[^>]*>([\s\S]*?)<\/body>/i);
        document.getElementById("visualEditor").innerHTML = bodyMatch ? bodyMatch[1] : content;
        document.getElementById("visualToolbar").style.display="flex";
      }else{
        document.getElementById("visualEditor").innerHTML = "<em>Walang Visual Editor para sa ganitong uri ng file</em>";
        document.getElementById("visualToolbar").style.display="none";
      }
    }else{
      document.getElementById("codeEditor").value="/* Hindi tekstong file — hindi maaaring i-edit dito */";
      document.getElementById("visualEditor").innerHTML="<em>Hindi tekstong file</em>";
    }

    showStatus(`✅ Nakuha na ang ${currentFile}`, "success");
    refreshPreview();
  }catch(e){
    showStatus(`❌ Nabigo: ${e.message}`, "error");
  }
}

// ==================================================
// 📤 HAKBANG — I-SAVE SA GITHUB
// ==================================================
async function saveToGitHub(){
  if(!requireLogin()) return;
  if(!currentFile){ showStatus("❌ Pumili muna ng file", "error"); return; }
  const token=await getToken();
  if(!token) return;

  // Kunin ang laman mula sa aktibong Tab
  let content="";
  if(activeTab==="visual"){
    content=assembleFullHtml();
  }else if(activeTab==="code"){
    content=document.getElementById("codeEditor").value;
  }else{
    content=document.getElementById("codeEditor").value;
  }

  if(!content.trim()){ showStatus("❌ Walang laman — hindi maaaring walang laman", "error"); return; }

  const btn=document.getElementById("saveBtn");
  btn.disabled=true; btn.textContent="⏳ Isinasave...";
  showStatus(`⏳ Ipinapadala ang ${currentFile} sa GitHub...`, "info");

  try{
    const encoded=btoa(unescape(encodeURIComponent(content)));
    const body={
      message: `I-update ${currentFile} — ${new Date().toLocaleString('fil-PH')}`,
      content: encoded,
      branch: BRANCH
    };
    if(currentSha) body.sha=currentSha;

    const res=await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${currentFile}`, {
      method: "PUT",
      headers: {
        "Authorization": `token ${token}`,
        "Content-Type": "application/json"
      },
      body: JSON.stringify(body)
    });
    if(!res.ok) throw new Error(await res.text());
    const data=await res.json();
    currentSha=data.content.sha;

    showStatus(`✅ Matagumpay! Nai-save na ang ${currentFile} — I-refresh ang pahina upang makita ang pagbabago`, "success");
    refreshPreview();
  }catch(e){
    showStatus(`❌ Nabigo: ${e.message}`, "error");
  }

  btn.disabled=false; btn.textContent="💾 I-save sa GitHub";
}

// ==================================================
// 🔄 PAGPALIT NG TAB
// ==================================================
function switchTab(tab){
  activeTab=tab;

  // Palitan ang Aktibong Tab
  document.querySelectorAll(".editor-tab").forEach(b=>b.classList.remove("active"));
  event.target.classList.add("active");

  // Palitan ang Laman
  document.querySelectorAll(".editor-pane").forEach(p=>p.classList.remove("active"));
  document.getElementById(`pane-${tab}`).classList.add("active");

  // Ipakita / Itago ang Toolbar
  document.getElementById("visualToolbar").style.display=(tab==="visual" && isHtmlFile(currentFile))?"flex":"none";

  // Paglipat: Visual → Code
  if(tab==="code") syncVisualToCode();

  // Paglipat: Preview
  if(tab==="preview") refreshPreview();
}

// ==================================================
// 🔄 PAGTUTUGMA NG LAMAN
// ==================================================
function syncVisualToCode(){
  if(!isHtmlFile(currentFile)) return;
  document.getElementById("codeEditor").value=assembleFullHtml();
}

function assembleFullHtml(){
  // Subukan kunin ang kasalukuyang ulo mula sa Code Editor
  let head = `<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="style.css">`;

  const code=document.getElementById("codeEditor").value;
  const headMatch=code.match(/<head\b[^>]*>([\s\S]*?)<\/head>/i);
  if(headMatch) head=headMatch[1];

  const bodyContent=document.getElementById("visualEditor").innerHTML;

  return `<!DOCTYPE html>
<html lang="tl">
<head>
${head}
</head>
<body>
${bodyContent}
</body>
</html>`;
}

// ==================================================
// 📺 PREVIEW
// ==================================================
function refreshPreview(){
  const frame=document.getElementById("previewFrame");
  const content=activeTab==="visual" ? assembleFullHtml() : document.getElementById("codeEditor").value;
  const doc=frame.contentDocument || frame.contentWindow.document;
  doc.open();
  doc.write(content||"<html><body style='padding:20px; color:#666;'>Walang laman</body></html>");
  doc.close();
}

// ==================================================
// 🎨 VISUAL EDITOR — MGA UTOS
// ==================================================
function execCmd(cmd, val=null){
  document.execCommand(cmd, false, val);
  document.getElementById("visualEditor").focus();
  syncVisualToCode();
}
function formatBlock(tag){
  document.execCommand('formatBlock', false, tag);
  syncVisualToCode();
}
function insertLink(){
  const url=prompt("Ipasok ang URL:");
  if(url) execCmd('createLink', url);
}
function insertImage(){
  const url=prompt("Ipasok ang Lokasyon ng Larawan:");
  if(url) execCmd('insertImage', url);
}
function undo(){ document.execCommand('undo'); syncVisualToCode(); }
function redo(){ document.execCommand('redo'); syncVisualToCode(); }

// ==================================================
// 📌 TULONG — URI NG FILE
// ==================================================
function isHtmlFile(f){
  return f && /\.(html|htm)$/i.test(f);
}
function isTextFile(f){
  return f && /\.(html|htm|css|js|json|md|txt)$/i.test(f);
}

// ==================================================
// 🚀 KUSANG GAGAWIN PAGBUKAS
// ==================================================
document.addEventListener("DOMContentLoaded", ()=>{
  if(!requireLogin()) return;
  // Auto-load kung may napili na
});
</script>

</body>
</html>
