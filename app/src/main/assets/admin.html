<!DOCTYPE html>
<html lang="tl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="style.css">
<title>Admin Panel — Mga Ilegal na Bisyo</title>
</head>
<body>

<!-- ============= LOGIN ============= -->
<div id="login-section" class="login-container">
  <h2>🔑 Pag-login sa Admin</h2>
  <p id="login-error" class="error-text hidden"></p>

  <label>Password:</label>
  <input type="password" id="admin-password" placeholder="Ipasok ang password...">

  <label>⏰ Tagal ng Session:</label>
  <select id="session-duration">
    <option value="1800000">30 Minuto</option>
    <option value="3600000">1 Oras</option>
    <option value="86400000">1 Araw</option>
    <option value="604800000">1 Linggo</option>
  </select>

  <button onclick="login()">🔐 Mag-login</button>
</div>

<!-- ============= ADMIN PANEL ============= -->
<div id="admin-section" class="hidden">
  <div class="header">
    <div class="header-left">
      <h1>🛠️ Admin Panel</h1>
      <p id="connection-status">— Sinusuri ang koneksyon...</p>
    </div>
    <button class="btn-secondary" onclick="logout()">🚪 Mag-logout</button>
  </div>

  <div class="panel">
    <!-- STATUS BAR -->
    <div class="panel-card">
      <div class="top-bar">
        <span id="status-indicator">● Sinusuri...</span>
        <div>
          <button class="btn-primary" onclick="syncAllContent()">🔄 I-Sync Lahat</button>
          <button class="btn-secondary" onclick="clearCache()">🗑️ Burahin Cache</button>
        </div>
      </div>
    </div>

    <!-- PAGPILI NG PAHINA -->
    <div class="panel-card">
      <h3>📄 Piliin ang Pahina na Ie-edit:</h3>
      <select id="page-selector" onchange="loadSelectedPage()">
        <option value="">— Pumili —</option>
        <option value="index.html">🏠 index.html</option>
        <option value="main.html">📄 main.html</option>
        <option value="admin.html">🔧 admin.html</option>
        <option value="style.css">🎨 style.css</option>
      </select>
      <p id="page-info" class="note">Pumili muna sa itaas</p>
    </div>

    <!-- LALAGYAN NG NILALAMAN -->
    <div class="panel-card">
      <div class="top-bar">
        <h3>✏️ Nilalaman:</h3>
        <div>
          <button class="btn-secondary" onclick="loadFromGitHub()">📥 Kunin mula sa GitHub</button>
          <button class="btn-secondary" onclick="loadFromLocal()">📂 Kunin mula sa Lokal</button>
        </div>
      </div>
      <textarea id="content-editor" rows="22" placeholder="Mag-login muna at pumili ng pahina..." spellcheck="false"></textarea>
      
      <div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn-primary" onclick="saveContent()">💾 I-save at I-upload</button>
        <button class="btn-secondary" onclick="saveLocal()">📂 I-save Lokal</button>
        <span id="save-status" style="padding:8px 12px;"></span>
      </div>
    </div>

    <!-- OFFLINE NAKABINBIN -->
    <div id="offline-section" class="panel-card hidden">
      <h3>📤 Nakabinbing Pagbabago (I-sync pag-online)</h3>
      <div id="pending-list"></div>
      <button class="btn-primary" onclick="syncPending()">🔄 Ipadala Ngayon</button>
    </div>
  </div>
</div>

<script>
// ============= KONFIGURASYON =============
const REPO_OWNER = "fbvlink2026-lab";
const REPO_NAME  = "bisyo";
const BRANCH     = "main";
const ASSETS_PATH = "app/src/main/assets";

// ✅ NAKATAGO — PALITAN LANG SA SETUP-TOKEN.HTML
let ENCRYPTED_TOKEN = "PROVIDED_WHEN_BUILT_WITH_SETUP_TOKEN";

const SESSION_KEY    = "bisyo_session_data";
const PASSWORD_KEY   = "bisyo_last_password";
const OFFLINE_QUEUE  = "bisyo_offline_queue";

let currentFileName = null;
let currentSha = null;
let decryptedToken = null;

// ============= SURIIN ANG SESSION PAGKA-REFRESH =============
window.addEventListener('DOMContentLoaded', () => {
  checkSessionOnLoad();  // ✅ KUSANG TUMATAWAG PAGKA-REFRESH
  updateConnectionStatus();
  setInterval(updateConnectionStatus, 8000);
});

// ✅ BAGONG FUNGSI — KUSANG MAG-LOGIN PAGKA-REFRESH KUNG BUWAG PA ANG SESSION
function checkSessionOnLoad() {
  const sessionData = JSON.parse(localStorage.getItem(SESSION_KEY) || 'null');
  if (!sessionData) return showLoginForm();

  const now = Date.now();
  if (now >= sessionData.expiresAt) {
    logout();
    return showLoginForm();
  }

  // ✅ BUWAG PA — KUNIN ANG PASSWORD AT DEKRIPTA ANG TOKEN
  const password = localStorage.getItem(PASSWORD_KEY);
  if (!password) return showLoginForm();

  // ✅ KUSANG BASAHIN ANG TOKEN — HINDI NA KAILANGANG MAG-LOGIN ULIT!
  decryptToken(password).then(token => {
    decryptedToken = token;
    showAdminPanel();
    document.getElementById('admin-password').value = password;
  }).catch(err => {
    console.warn('Hindi mabasa ang token:', err);
    logout();
    showLoginForm();
  });
}

function showLoginForm() {
  document.getElementById('login-section').classList.remove('hidden');
  document.getElementById('admin-section').classList.add('hidden');
}

function showAdminPanel() {
  document.getElementById('login-section').classList.add('hidden');
  document.getElementById('admin-section').classList.remove('hidden');
  updatePendingUI();
}

// ============= LOGIN =============
function login() {
  const password = document.getElementById('admin-password').value.trim();
  if (!password) return showLoginError('❌ Ilagay ang password');

  const duration = parseInt(document.getElementById('session-duration').value);
  const sessionData = {
    expiresAt: Date.now() + duration,
    durationMs: duration,
    loggedInAt: Date.now()
  };

  // ✅ Subukang basahin ang token
  decryptToken(password).then(token => {
    decryptedToken = token;
    localStorage.setItem(SESSION_KEY, JSON.stringify(sessionData));
    localStorage.setItem(PASSWORD_KEY, password);
    showAdminPanel();
  }).catch(err => {
    showLoginError('❌ Maling password o sira ang token');
  });
}

function showLoginError(msg) {
  const err = document.getElementById('login-error');
  err.textContent = msg;
  err.classList.remove('hidden');
}

function logout() {
  localStorage.removeItem(SESSION_KEY);
  localStorage.removeItem(PASSWORD_KEY);
  decryptedToken = null;
  currentSha = null;
  showLoginForm();
  document.getElementById('login-error').classList.add('hidden');
}

// ============= DEKRIPSYON NG TOKEN =============
async function decryptToken(password) {
  if (!ENCRYPTED_TOKEN || ENCRYPTED_TOKEN.startsWith("PROVIDED")) {
    throw new Error("Wala pang naka-setup na Token");
  }

  // ✅ PAREHONG ASIN AT PAMAMARAAN SA SETUP-TOKEN.HTML
  const encoder = new TextEncoder();
  const salt = encoder.encode("BisyoSalt2026");
  const encryptedBytes = Uint8Array.from(atob(ENCRYPTED_TOKEN), c => c.charCodeAt(0));

  const iv = encryptedBytes.slice(0, 12);
  const data = encryptedBytes.slice(12);

  const keyMaterial = await crypto.subtle.importKey(
    'raw', encoder.encode(password), { name: 'PBKDF2' }, false, ['deriveKey']
  );
  const key = await crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt, iterations: 100000, hash: 'SHA-256' },
    keyMaterial, { name: 'AES-GCM', length: 256 }, false, ['decrypt']
  );

  const decrypted = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, data);
  return new TextDecoder().decode(decrypted);
}

// ============= KONEKSYON =============
function updateConnectionStatus() {
  const online = navigator.onLine;
  const indicator = document.getElementById('status-indicator');
  const connText = document.getElementById('connection-status');

  if (online) {
    indicator.textContent = "● Online — Handa mag-sync";
    indicator.style.color = "#16a34a";
    connText.textContent = "✅ Nakakakonekta sa GitHub";
  } else {
    indicator.textContent = "● Offline — Lokal lang";
    indicator.style.color = "#d97706";
    connText.textContent = "⚠️ Walang internet — naka-save sa telepono";
  }
}

// ============= PAGPILI AT PAGBASA NG PAHINA =============
function loadSelectedPage() {
  const sel = document.getElementById('page-selector');
  currentFileName = sel.value;
  if (!currentFileName) {
    document.getElementById('page-info').textContent = "Pumili muna sa itaas";
    document.getElementById('content-editor').value = "";
    return;
  }
  document.getElementById('page-info').textContent = `📄 ${currentFileName} — Pumili kung saan kukunin`;
  document.getElementById('content-editor').value = "";
  currentSha = null;
}

// ✅ KUNIN MULA SA GITHUB — BAGONG KOPYA
async function loadFromGitHub() {
  if (!currentFileName) return alert("Pumili muna ng pahina!");
  if (!decryptedToken) return alert("Kailangan ng login at Token!");

  showSaveStatus("⏰ Kinukuha mula sa GitHub...", "warning");

  try {
    const path = `${ASSETS_PATH}/${currentFileName}`;
    const res = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${path}?ref=${BRANCH}`, {
      headers: { Authorization: `token ${decryptedToken}` }
    });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    currentSha = data.sha;
    const content = atob(data.content.replace(/-/g, '+').replace(/_/g, '/'));
    document.getElementById('content-editor').value = content;
    saveToLocalCache(currentFileName, content);
    showSaveStatus(`✅ Mula sa GitHub — ${currentFileName}`, "success");
  } catch (err) {
    showSaveStatus(`❌ ${err.message}`, "error");
  }
}

// ✅ KUNIN MULA SA LOKAL
function loadFromLocal() {
  if (!currentFileName) return alert("Pumili muna ng pahina!");
  const content = localStorage.getItem(`page_cache_${currentFileName}`);
  if (!content) return showSaveStatus("⚠️ Walang nahanap na lokal na kopya", "warning");
  document.getElementById('content-editor').value = content;
  showSaveStatus(`✅ Mula sa Lokal — ${currentFileName}`, "success");
}

function saveToLocalCache(name, content) {
  localStorage.setItem(`page_cache_${name}`, content);
}

// ============= ✅ SAVE + SYNC =============
async function saveContent() {
  if (!currentFileName) return alert("Pumili muna ng pahina!");
  const content = document.getElementById('content-editor').value;
  if (!content) return alert("Walang nilalaman na isasave!");

  // Laging i-save muna lokal
  saveToLocalCache(currentFileName, content);
  showSaveStatus("📂 Naka-save na Lokal", "success");

  // Kung offline — ilagay sa pila
  if (!navigator.onLine) {
    addToOfflineQueue(currentFileName, content);
    return;
  }

  // Kung online — i-upload direkta
  if (!decryptedToken) return showSaveStatus("⚠️ Walang Token — naka-save lokal lang", "warning");

  await uploadToGitHub(currentFileName, content);
}

async function saveLocal() {
  if (!currentFileName) return alert("Pumili muna ng pahina!");
  const content = document.getElementById('content-editor').value;
  saveToLocalCache(currentFileName, content);
  showSaveStatus("✅ Naka-save na Lokal", "success");
}

// ✅ TUNAY NA SYNC — I-UPLOAD SA GITHUB
async function uploadToGitHub(filename, content) {
  showSaveStatus("⏰ Iin-upload sa GitHub...", "warning");

  try {
    const path = `${ASSETS_PATH}/${filename}`;

    // Kunin ang SHA kung wala pa
    if (!currentSha) {
      const getRes = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${path}?ref=${BRANCH}`, {
        headers: { Authorization: `token ${decryptedToken}` }
      });
      if (getRes.ok) {
        const data = await getRes.json();
        currentSha = data.sha;
      }
    }

    const res = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${path}`, {
      method: "PUT",
      headers: {
        Authorization: `token ${decryptedToken}`,
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        message: `📝 Update: ${filename} — ${new Date().toLocaleString()}`,
        content: btoa(unescape(encodeURIComponent(content))),
        sha: currentSha || undefined,
        branch: BRANCH
      })
    });

    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const result = await res.json();
    currentSha = result.content.sha;
    showSaveStatus(`✅ Na-sync sa GitHub!`, "success");

  } catch (err) {
    showSaveStatus(`❌ Nabigo: ${err.message} — Naka-save lokal lang`, "error");
    addToOfflineQueue(filename, content);
  }
}

// ============= ✅ SYNC LAHAT — AYUSIN NA! =============
async function syncAllContent() {
  if (!navigator.onLine) return alert("⚠️ Kailangan ng internet para mag-sync!");
  if (!decryptedToken) return alert("❌ Kailangan ng Token — mag-login muli");

  showSaveStatus("⏰ Sinisimulan ang Sync...", "warning");

  // 1. I-sync ang mga nakabinbin
  await syncPending();

  // 2. I-refresh ang kasalukuyang pahina mula sa GitHub
  if (currentFileName) {
    await loadFromGitHub();
  }

  showSaveStatus("✅ Tapos na ang Sync!", "success");
}

// ============= OFFLINE QUEUE =============
function addToOfflineQueue(filename, content) {
  const queue = JSON.parse(localStorage.getItem(OFFLINE_QUEUE) || '[]');
  const existing = queue.findIndex(q => q.filename === filename);
  const item = { filename, content, savedAt: Date.now() };
  if (existing >= 0) queue[existing] = item;
  else queue.push(item);
  localStorage.setItem(OFFLINE_QUEUE, JSON.stringify(queue));
  updatePendingUI();
}

async function syncPending() {
  if (!navigator.onLine || !decryptedToken) return;

  const queue = JSON.parse(localStorage.getItem(OFFLINE_QUEUE) || '[]');
  if (!queue.length) return;

  for (const item of queue) {
    await uploadToGitHub(item.filename, item.content);
  }
  localStorage.removeItem(OFFLINE_QUEUE);
  updatePendingUI();
}

function updatePendingUI() {
  const queue = JSON.parse(localStorage.getItem(OFFLINE_QUEUE) || '[]');
  const section = document.getElementById('offline-section');
  const list = document.getElementById('pending-list');

  if (queue.length) {
    section.classList.remove('hidden');
    list.innerHTML = queue.map(q =>
      `<div class="panel-card" style="margin:4px 0;padding:10px">📄 ${q.filename} — ${new Date(q.savedAt).toLocaleTimeString()}</div>`
    ).join('');
  } else {
    section.classList.add('hidden');
  }
}

function clearCache() {
  if (!confirm("Burahin lahat ng lokal na kopya?")) return;
  Object.keys(localStorage).filter(k => k.startsWith('page_cache_')).forEach(k => localStorage.removeItem(k));
  showSaveStatus("✅ Nabura na ang cache", "success");
  if (currentFileName) document.getElementById('content-editor').value = "";
}

function showSaveStatus(text, type) {
  const el = document.getElementById('save-status');
  el.textContent = text;
  el.style.color = type === 'success' ? '#16a34a' : type === 'warning' ? '#d97706' : '#dc2626';
}

// ✅ KUSANG MAG-SYNC PAGBALIK NG INTERNET
window.addEventListener('online', () => {
  updateConnectionStatus();
  syncPending();
});
window.addEventListener('offline', updateConnectionStatus);
</script>

</body>
</html>
