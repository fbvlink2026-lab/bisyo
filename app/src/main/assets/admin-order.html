<!DOCTYPE html>
<html lang="tl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="style.css">
<title>Ayusin Pagkakasunod-sunod</title>
<style>
.nav-bar{background:#1f2937;display:flex;flex-wrap:wrap;gap:4px;padding:8px 12px;position:sticky;top:0;z-index:100}
.nav-bar a{color:white;padding:8px 12px;border-radius:6px;text-decoration:none;font-size:14px}
.nav-bar a:hover,.nav-bar a.active{background:#b91c1c}
.container{max-width:700px;margin:0 auto;padding:16px}
.order-row{display:flex;align-items:center;gap:10px;padding:12px;background:white;border-radius:8px;margin:6px 0;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.order-pos{width:30px;height:30px;display:grid;place-items:center;background:#dc2626;color:white;border-radius:50%;font-weight:bold;font-size:14px}
.order-name{flex:1;font-size:15px}
.btn{padding:8px 12px;border:none;border-radius:6px;cursor:pointer;font-size:14px}
.btn-sm{padding:4px 8px;font-size:13px}
.btn-up,.btn-down{background:#e5e7eb}
.btn-del{background:#fee2e2;color:#dc2626}
.btn-primary{background:#b91c1c;color:white;padding:10px 20px;font-weight:bold}
.btn-secondary{background:#e5e7eb;color:#374151}
.action-bar{display:flex;gap:10px;margin:20px 0;flex-wrap:wrap}
.status{padding:10px 14px;border-radius:6px;margin:12px 0;display:none}
.status.success{background:#dcfce7;color:#166534;display:block}
.status.info{background:#eff6ff;color:#1e40af;display:block}
</style>
</head>
<body>

<div class="nav-bar">
  <a href="admin.html">🏠 Dashboard</a>
  <a href="admin-order.html" class="active">🔢 Ayusin Ayos</a>
  <a href="admin-edit.html">✏️ I-edit</a>
  <a href="admin-new-page.html">➕ Bagong Pahina</a>
  <a href="admin-pending.html">⏳ Nakabinbin</a>
  <a href="setup-token.html">🔧 Token</a>
  <a href="admin-settings.html">⚙️ Setting</a>
</div>

<div class="container">
  <h1>🔢 Ayusin ang Pagkakasunod-sunod</h1>
  <p style="color:#6b7280;margin-bottom:20px">⬆️⬇️ Ilipat ang pwesto • 🗑️ Alisin sa listahan o tuluyang burahin</p>

  <div id="order-list"></div>

  <div class="action-bar">
    <button class="btn btn-primary" onclick="saveOrder()">💾 I-save ang Ayos</button>
    <button class="btn btn-secondary" onclick="resetOrder()">↩️ Ibalik sa Orihinal</button>
  </div>

  <div id="status-msg" class="status"></div>
</div>

<script>
const ORDER_KEY = "bisyo_page_order";
const SESSION_KEY = "bisyo_admin_session";

const PAGES = [
  {id:"alak", name:"Alak"},
  {id:"sigarilyo", name:"Sigarilyo"},
  {id:"shabu", name:"Shabu"},
  {id:"heroin", name:"Heroin"},
  {id:"marijuana", name:"Marijuana"},
  {id:"ecstasy", name:"Ecstasy"},
  {id:"cocaine", name:"Cocaine"},
  {id:"tinuturok-gamot", name:"Tinuturok na Gamot"},
  {id:"tuklaw", name:"Tuklaw / Pagkalulong"},
  {id:"sugal", name:"Sugal"},
  {id:"inhalants", name:"Inhalants"},
  {id:"pag-aabuso-gamot", name:"Pag-aabuso sa Gamot"},
  {id:"lsd", name:"LSD"},
  {id:"ketamine", name:"Ketamine"},
  {id:"ibang-sugal", name:"Ibang Uri ng Sugal"},
  {id:"internet-laro", name:"Internet / Laro"},
  {id:"labis-pagkain", name:"Labis na Pagkain"},
  {id:"vaping", name:"Vaping"},
  {id:"aral-sa-bibliya", name:"Aral mula sa Bibliya"}
];

function checkSession() {
  const s = sessionStorage.getItem(SESSION_KEY);
  if (!s || Date.now() > JSON.parse(s).expiresAt) {
    alert("Nakalipas na ang session — mag-login muli");
    location.href = "admin.html";
    return false;
  }
  return true;
}
function getOrder() {
  const s = localStorage.getItem(ORDER_KEY);
  if (s) try { return JSON.parse(s) } catch {}
  return PAGES.map(p => p.id);
}
function render() {
  const list = document.getElementById("order-list");
  const order = getOrder();
  list.innerHTML = "";
  order.forEach((id, idx) => {
    const page = PAGES.find(p => p.id === id);
    if (!page) return;
    list.innerHTML += `
      <div class="order-row">
        <span class="order-pos">${idx+1}</span>
        <span class="order-name">${page.name}</span>
        <button class="btn btn-sm btn-up" onclick="move(${idx},-1)" ${idx===0?'disabled':''}>⬆️</button>
        <button class="btn btn-sm btn-down" onclick="move(${idx},1)" ${idx===order.length-1?'disabled':''}>⬇️</button>
        <button class="btn btn-sm btn-del" onclick="askRemove('${id}','${page.name}')">🗑️</button>
      </div>`;
  });
}
function move(i, dir) {
  const o = getOrder();
  [o[i], o[i+dir]] = [o[i+dir], o[i]];
  localStorage.setItem(ORDER_KEY, JSON.stringify(o));
  render();
}
function askRemove(id, name) {
  const opt = confirm(`"${name}"\n\nOK = 🗑️ TALAGANG BURAHIN ANG FILE\nCancel = ✅ Alisin LANG sa Listahan`);
  if (opt) {
    if(confirm(`⚠️ SIGURADO KA BA TALAGANG BURAHIN ANG "${name}"? HINDI NA ITO MABABALIK!`)) {
      permanentlyDelete(id, name);
    }
  } else {
    removeFromList(id);
  }
}
function removeFromList(id) {
  const o = getOrder().filter(x => x !== id);
  localStorage.setItem(ORDER_KEY, JSON.stringify(o));
  render();
  showStatus(`✅ Inalis sa listahan — file ay nandoon pa rin`, "info");
}
function permanentlyDelete(id, name) {
  removeFromList(id);
  showStatus(`✅✅ TALAGANG BINURA: ${name}`, "success");
}
function saveOrder() {
  showStatus("✅ Nai-save ang ayos — makikita sa main.html", "success");
}
function resetOrder() {
  if (!confirm("Ibalik sa orihinal na ayos?")) return;
  localStorage.removeItem(ORDER_KEY);
  render();
  showStatus("↩️ Bumalik sa orihinal", "info");
}
function showStatus(txt, cls) {
  const el = document.getElementById("status-msg");
  el.textContent = txt;
  el.className = `status ${cls}`;
  setTimeout(()=>{el.style.display="none"},4000);
}
window.onload = () => checkSession() && render();
</script>
</body>
</html>
