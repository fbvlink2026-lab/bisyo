<!DOCTYPE html>
<html lang="tl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="style.css">
<title>🔧 I-setup ang Token</title>
</head>
<body>

<div class="nav-bar">
  <a href="admin.html">🏠 Dashboard</a>
  <a href="admin-order.html">🔢 Ayusin Ayos</a>
  <a href="admin-edit.html">✏️ I-edit</a>
  <a href="admin-new-page.html">➕ Bagong Pahina</a>
  <a href="admin-pending.html">⏳ Nakabinbin</a>
  <a href="setup-token.html" class="active">🔧 Token</a>
  <a href="admin-settings.html">⚙️ Setting</a>
</div>

<div class="container">
  <div class="card">
    <h1>🔧 I-setup ang GitHub Token</h1>

    <div class="note">
      ⚠️ Ang token ay I-e-encrypt gamit ang iyong Admin Password — hindi ito makikita nang malinaw.<br>
      Gumamit ng Personal Access Token (Classic) mula sa GitHub na may sakop na: <code>repo</code>
    </div>

    <label>Admin Password:</label>
    <input type="password" id="admin-pass" placeholder="Ipasok ang password...">

    <label>GitHub Token:</label>
    <input type="password" id="github-token" placeholder="ghp_xxxxxxxxxxxx">

    <label>Encrypted Token:</label>
    <input type="text" id="encrypted-output" readonly placeholder="Lalabas dito pagkatapos i-encrypt...">

    <button class="btn btn-primary" onclick="doEncrypt()">🔐 I-ENCRYPT ANG TOKEN</button>

    <div id="status-msg" class="status"></div>
  </div>
</div>

<script>
// Simple XOR Encryption — susi = password
function encryptToken(token, password) {
  let result = "";
  for (let i = 0; i < token.length; i++) {
    result += String.fromCharCode(token.charCodeAt(i) ^ password.charCodeAt(i % password.length));
  }
  return btoa(result);
}

function doEncrypt() {
  const pw = document.getElementById("admin-pass").value.trim();
  const token = document.getElementById("github-token").value.trim();

  if (!pw || !token) {
    showStatus("❌ Punan ang password at token", "error");
    return;
  }

  const encrypted = encryptToken(token, pw);
  document.getElementById("encrypted-output").value = encrypted;
  showStatus("✅ Nai-encrypt! Pumunta sa Dashboard — kusang lalabas na doon", "success");

  // ✅ KUSANG IPASA SA DASHBOARD — HINDI NA KAILANGANG KOPYAHIN
  localStorage.setItem("bisyo_pending_token", encrypted);
}

function showStatus(txt, cls) {
  const el = document.getElementById("status-msg");
  el.textContent = txt;
  el.className = `status ${cls}`;
}
</script>
</body>
</html>
