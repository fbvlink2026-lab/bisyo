<!DOCTYPE html>
<html lang="tl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>🔧 I-update ang Token — Admin</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#1f2937;color:white;font-family:Arial,sans-serif;padding:20px;max-width:600px;margin:0 auto}
h1{color:#ef4444;margin-bottom:6px;font-size:20px}
.desc{color:#9ca3af;margin-bottom:24px;font-size:14px;line-height:1.5}
.card{background:#374151;padding:20px;border-radius:12px;margin-bottom:16px}
label{display:block;margin-bottom:6px;font-weight:bold;font-size:14px}
input{width:100%;padding:12px;border-radius:8px;border:none;background:#4b5563;color:white;font-size:15px;margin-bottom:14px}
button{padding:12px 20px;border:none;border-radius:8px;font-size:15px;font-weight:bold;cursor:pointer;margin-right:8px;margin-bottom:8px}
.btn-red{background:#dc2626;color:white}
.btn-green{background:#16a34a;color:white}
.btn-blue{background:#2563eb;color:white}
.hidden{display:none !important}
.success{color:#4ade80;margin:10px 0;line-height:1.5}
.warning{color:#facc15;margin:10px 0;line-height:1.5}
.error-text{color:#f87171;margin:10px 0}
.info{color:#93c5fd;margin:8px 0;font-size:13px;line-height:1.5}
pre{background:#111827;padding:12px;border-radius:8px;font-size:11px;color:#a5f3fc;overflow-x:auto;white-space:pre-wrap;word-break:break-all;margin:12px 0}
</style>
</head>
<body>

<h1>🔧 I-update ang Encrypted Token</h1>
<p class="desc">
  ✅ Gumagana kahit walang internet — hindi napipigilan.<br>
  ✅ Pagbalik ng internet — kusang magsi-sync ang lahat.
</p>

<div class="card">
  <label>🔑 Bagong Token na I-encrypt:</label>
  <input type="text" id="new-token" placeholder="ghp_xxxxxxxxxxxx">

  <label>🔒 Admin Password (6+ letra):</label>
  <input type="password" id="admin-pass" placeholder="hal. bisyo2026">

  <button class="btn-red" onclick="processToken()">🔐 Ihanda ang Pagbabago</button>
  <div id="status"></div>
</div>

<!-- ✅ KAHIT OFFLINE — LAGING MAY RESULTA -->
<div class="card hidden" id="result-box">
  <p class="success">✅ HANDA NA — Ito ang linyang papalitan sa admin.html:</p>
  <pre id="token-line"></pre>

  <!-- ✅ IMBAKAN LOKAL — KAHIT WALANG INTERNET -->
  <p class="info">📌 Naka-imbak na ito sa iyong device — kusang ia-upload kapag may internet na.</p>

  <button class="btn-green" onclick="copyLine()">📋 Kopyahin ang Linyang Ito</button>
  <button class="btn-blue" onclick="syncNow()">🔄 I-upload Ngayon sa GitHub</button>
</div>

<script>
// ===== KONFIGURASYON =====
const REPO_OWNER = "fbvlink2026-lab";
const REPO_NAME  = "bisyo";
const BRANCH     = "main";
const FILE_PATH   = "app/src/main/assets/admin.html";
const STORAGE_KEY = "bisyo_pending_token_patch"; // ✅ Imbakan ng nakabinbing pagbabago

// ===== ENCRYPTION — PAREHO SA ADMIN.HTML =====
async function deriveKey(password) {
  const encoder = new TextEncoder();
  const salt = encoder.encode("BisyoSalt2026");
  const keyMaterial = await crypto.subtle.importKey(
    "raw", encoder.encode(password), { name: "PBKDF2" }, false, ["deriveKey"]
  );
  return keyMaterial.deriveKey(
    { name: "PBKDF2", salt: salt, iterations: 100000, hash: "SHA-256" },
    { name: "AES-GCM", length: 256 }, false, ["encrypt"]
  );
}

async function encryptToken(token, password) {
  const key = await deriveKey(password);
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const encoder = new TextEncoder();
  const encrypted = await crypto.subtle.encrypt(
    { name: "AES-GCM", iv: iv }, key, encoder.encode(token)
  );
  const combined = new Uint8Array(iv.length + encrypted.byteLength);
  combined.set(iv);
  combined.set(new Uint8Array(encrypted), iv.length);
  return btoa(String.fromCharCode(...combined));
}

// ===== PANGUNAHING PROSESO — HINDI NAPIPIGILAN KAHIT OFFLINE =====
async function processToken() {
  const newToken = document.getElementById('new-token').value.trim();
  const password = document.getElementById('admin-pass').value;
  const status = document.getElementById('status');
  const resultBox = document.getElementById('result-box');

  // ✅ PAGSUSURI — HINDI KAILANGAN NG INTERNET DITO
  if (!newToken)
    return status.innerHTML = '<span class="error-text">❌ Ilagay ang Token</span>';
  if (!password || password.length < 6)
    return status.innerHTML = '<span class="error-text">❌ Hindi bababa sa 6 letra ang password</span>';

  status.innerHTML = '<span class="warning">⏰ Ini-encrypt ang Token...</span>';

  // ✅ I-ENCRYPT — GUMAGANA KAHIT WALANG INTERNET
  const encrypted = await encryptToken(newToken, password);
  const newLine = `const ENCRYPTED_TOKEN = "${encrypted}";`;

  // ✅ IMBAG LOKAL — KAHIT WALANG INTERNET, HINDI NAWALA!
  localStorage.setItem(STORAGE_KEY, JSON.stringify({
    line: newLine,
    timestamp: Date.now()
  }));

  // ✅ IPAKITA — LAGING MAY RESULTA
  document.getElementById('token-line').textContent = newLine;
  resultBox.classList.remove('hidden');

  if (!navigator.onLine) {
    status.innerHTML = `<span class="warning">⚠️ Walang internet — naka-imbak lokal. Kusang ia-upload kapag may internet na.</span>`;
  } else {
    status.innerHTML = `<span class="success">✅ Handa na — handa nang i-sync!</span>`;
    // ✅ KUNG MAY INTERNET AGAD — KUSANG I-UPLOAD
    setTimeout(() => syncNow(), 800);
  }
}

// ===== KAPAG MAY INTERNET NA — I-UPLOAD SA GITHUB =====
async function syncNow() {
  if (!navigator.onLine) {
    alert("⚠️ Wala pang internet — mananatiling naka-imbak lokal. Kusang ia-upload kapag bumalik ang koneksyon.");
    return;
  }

  const pendingRaw = localStorage.getItem(STORAGE_KEY);
  if (!pendingRaw) { alert("✅ Walang nakabinbing pagbabago."); return; }

  const pending = JSON.parse(pendingRaw);
  const newLine = pending.line;
  const writeToken = prompt("🔑 Ilagay ang iyong GitHub Token para sa pag-upload:");
  if (!writeToken) return;

  const status = document.getElementById('status');
  status.innerHTML = `<span class="warning">⏰ Ina-upload sa GitHub...</span>`;

  try {
    // 1. Kunin mula sa GitHub
    const getRes = await fetch(
      `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${FILE_PATH}?ref=${BRANCH}`,
      { headers: { "Authorization": `token ${writeToken}` } }
    );
    if (!getRes.ok) throw new Error(`File hindi makita: ${getRes.status}`);
    const data = await getRes.json();
    let content = atob(data.content.replace(/-/g,'+').replace(/_/g,'/'));

    // 2. Palitan lang ang Token line
    const pattern = /const\s+ENCRYPTED_TOKEN\s*=\s*["'][^"']*["']\s*;/;
    if (!pattern.test(content)) throw new Error("Hindi nakita ang ENCRYPTED_TOKEN");
    content = content.replace(pattern, newLine);

    // 3. I-commit pabalik
    const putRes = await fetch(
      `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${FILE_PATH}`,
      {
        method: "PUT",
        headers: {
          "Authorization": `token ${writeToken}`,
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          message: "🔐 Update: Encrypted Token",
          content: btoa(unescape(encodeURIComponent(content))),
          sha: data.sha,
          branch: BRANCH
        })
      }
    );
    if (!putRes.ok) throw new Error(`Nabigo: ${putRes.status}`);

    // ✅ TAPOS NA — TANGGALIN SA NAKABINING
    localStorage.removeItem(STORAGE_KEY);
    status.innerHTML = `<span class="success">✅ NAI-UPLOAD NA! Agad na magagamit sa website at app.</span>`;

  } catch (err) {
    status.innerHTML = `<span class="error-text">❌ Nabigo: ${err.message} — mananatiling naka-imbak, susubukan ulit.</span>`;
  }
}

// ✅ KAPAG BUMALIK ANG INTERNET — KUSANG SUSUBUKAN!
window.addEventListener('online', () => {
  if (localStorage.getItem(STORAGE_KEY)) {
    document.getElementById('status').innerHTML = `<span class="info">🔄 Bumalik ang internet — handa nang i-sync ang nakabinbing pagbabago.</span>`;
  }
});

function copyLine() {
  const line = document.getElementById('token-line').textContent;
  navigator.clipboard.writeText(line);
  alert("✅ Kinopya na! Naka-imbak na rin lokal — kusang ia-upload kapag online na.");
}
</script>
</body>
</html>
