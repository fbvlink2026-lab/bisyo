<!DOCTYPE html>
<html lang="tl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin — Pag-login</title>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Segoe UI', Roboto, Arial, sans-serif;
}
body {
  background: linear-gradient(135deg, #b91c1c, #dc2626);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
.login-card {
  background: white;
  border-radius: 20px;
  padding: 32px 28px;
  width: 100%;
  max-width: 420px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.25);
}
.login-card h1 {
  text-align: center;
  color: #1f2937;
  font-size: 22px;
  margin-bottom: 6px;
}
.login-card p.sub {
  text-align: center;
  color: #6b7280;
  margin-bottom: 24px;
}
label {
  display: block;
  font-weight: 600;
  color: #374151;
  margin: 16px 0 6px;
}
input, select {
  width: 100%;
  padding: 14px 16px;
  border: 2px solid #d1d5db;
  border-radius: 10px;
  font-size: 15px;
  transition: 0.2s;
}
input:focus, select:focus {
  outline: none;
  border-color: #b91c1c;
  box-shadow: 0 0 0 3px rgba(185,28,28,0.12);
}
.duration-note {
  font-size: 13px;
  color: #6b7280;
  margin-top: 4px;
}
.remember-row {
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 14px 0;
}
.remember-row input[type="checkbox"] {
  width: 18px;
  height: 18px;
  cursor: pointer;
  accent-color: #b91c1c;
}
.remember-row label {
  margin: 0;
  font-weight: normal;
  color: #4b5563;
  cursor: pointer;
}
.btn {
  width: 100%;
  padding: 14px;
  border: none;
  border-radius: 10px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
  transition: 0.2s;
  margin-top: 8px;
}
.btn-primary {
  background: linear-gradient(90deg, #b91c1c, #dc2626);
  color: white;
}
.btn-primary:hover { transform: translateY(-2px); }
.btn-primary:disabled {
  background: #9ca3af;
  cursor: not-allowed;
  transform: none;
}
.link-setup {
  text-align: center;
  margin-top: 16px;
  font-size: 14px;
  color: #6b7280;
}
.link-setup a {
  color: #b91c1c;
  text-decoration: none;
  font-weight: 600;
}
.status {
  padding: 12px;
  border-radius: 8px;
  margin-top: 16px;
  display: none;
}
.status.show { display: block; }
.status.error { background: #fee2e2; color: #b91c1c; border-left: 3px solid #ef4444; }
.status.success { background: #dcfce7; color: #166534; border-left: 3px solid #22c55e; }
.session-info {
  margin-top: 14px;
  padding: 10px 12px;
  background: #eff6ff;
  border-left: 3px solid #3b82f6;
  border-radius: 6px;
  font-size: 13px;
  color: #1e40af;
  display: none;
}
.session-info.show { display: block; }
</style>
</head>
<body>

<div class="login-card">
  <h1>🔐 Pag-login</h1>
  <p class="sub">Admin Panel — Bisyo Project</p>

  <div id="status" class="status"></div>
  <div id="sessionInfo" class="session-info"></div>

  <form id="loginForm" onsubmit="handleLogin(event)">
    <label for="password">Admin Password</label>
    <input type="password" id="password" placeholder="Ipasok ang iyong password" required>

    <label for="duration">Tagal ng Session</label>
    <select id="duration">
      <option value="5m">5 Minuto</option>
      <option value="15m">15 Minuto</option>
      <option value="1h" selected>1 Oras</option>
      <option value="8h">8 Oras</option>
      <option value="1d">1 Araw</option>
      <option value="7d">7 Araw</option>
      <option value="30d">30 Araw / 1 Buwan</option>
      <option value="90d">3 Buwan</option>
    </select>
    <p class="duration-note">Pagkatapos ng panahong ito, kailangang mag-login muli.</p>

    <div class="remember-row">
      <input type="checkbox" id="rememberPassword">
      <label for="rememberPassword">Tandaan ang password sa aparatong ito</label>
    </div>

    <button type="submit" class="btn btn-primary" id="loginBtn">✅ Mag-login</button>
  </form>

  <div class="link-setup">
    ⚙️ <a href="setup-token.html">I-setup ang GitHub Token</a>
  </div>
</div>

<script>
const SESSION_KEY = "bisyo_admin_session";
const SESSION_EXPIRY = "bisyo_session_expiry";
const STORAGE_REMEMBER = "bisyo_remember";

// ==================================================
// ✅ KONBERSYON NG DURATION → MILLISEGUNDO
// ==================================================
function parseDuration(val){
  const num = parseInt(val);
  const unit = val.replace(/[0-9]/g,"");
  switch(unit){
    case "m": return num * 60 * 1000;        // Minuto
    case "h": return num * 60 * 60 * 1000;   // Oras
    case "d": return num * 24 * 60 * 60 * 1000; // Araw
    default: return 60 * 60 * 1000;          // 1 Oras kung mali
  }
}

function showStatus(msg, type="error"){
  const el = document.getElementById("status");
  el.textContent = msg;
  el.className = `status ${type} show`;
}

function showSessionInfo(msg){
  const el = document.getElementById("sessionInfo");
  el.textContent = msg;
  el.classList.add("show");
}

function hashSimple(str){
  let h=0;
  for(let i=0;i<str.length;i++) h=((h<<5)-h)+str.charCodeAt(i),h|=0;
  return h.toString(16);
}

function formatExpiry(ms){
  const d = new Date(ms);
  return d.toLocaleDateString("tl-PH",{weekday:"long",hour:"2-digit",minute:"2-digit"});
}

function handleLogin(e){
  e.preventDefault();
  const password = document.getElementById("password").value.trim();
  const durationVal = document.getElementById("duration").value;
  const durationMs = parseDuration(durationVal);
  const remember = document.getElementById("rememberPassword").checked;
  const btn = document.getElementById("loginBtn");

  if(!password) return showStatus("❌ Ipasok ang password");

  btn.disabled = true;
  btn.textContent = "⏳ Tinitiyak...";

  // ✅ Palitan ng tunay na pagtutumbas ng password
  if(hashSimple(password) === "5e884898da280471" || password === "admin123"){
    const expiry = Date.now() + durationMs;

    // ✅ I-save ang password + oras ng pagtatapos
    sessionStorage.setItem(SESSION_KEY, btoa(password));
    sessionStorage.setItem(SESSION_EXPIRY, expiry.toString());

    if(remember) localStorage.setItem(STORAGE_REMEMBER, "1");
    else localStorage.removeItem(STORAGE_REMEMBER);

    showStatus("✅ Matagumpay — Pupunta sa Dashboard...", "success");
    showSessionInfo(`⏰ Magtatapos ang session: ${formatExpiry(expiry)}`);

    setTimeout(()=> location="admin-settings.html", 1200);
  }else{
    showStatus("❌ Maling password");
    btn.disabled = false;
    btn.textContent = "✅ Mag-login";
  }
}

// ==================================================
// ✅ SURIIN KUNG MAY HINDI PA TAPOS NA SESSION
// ==================================================
function checkExistingSession(){
  const expiry = sessionStorage.getItem(SESSION_EXPIRY);
  if(expiry){
    const expiryMs = parseInt(expiry);
    const now = Date.now();
    if(now < expiryMs){
      const remaining = expiryMs - now;
      let text = "";
      if(remaining < 60000) text = "mas mababa sa 1 minuto";
      else if(remaining < 3600000) text = Math.floor(remaining/60000) + " minuto";
      else if(remaining < 86400000) text = Math.floor(remaining/3600000) + " oras";
      else text = Math.floor(remaining/86400000) + " araw";
      showSessionInfo(`✅ May aktibong session — natatapos sa: ${formatExpiry(expiryMs)} (${text} pa)`);
    }else{
      // ✅ Natapos na — burahin
      sessionStorage.removeItem(SESSION_KEY);
      sessionStorage.removeItem(SESSION_EXPIRY);
      showSessionInfo("⚠️ Ang nakaraang session ay natapos na — Mag-login muli.");
    }
  }
}

document.addEventListener("DOMContentLoaded", ()=>{
  checkExistingSession();
  if(localStorage.getItem(STORAGE_REMEMBER)==="1"){
    document.getElementById("password").placeholder = "Nakatandaan — ilagay kung baguhin";
  }
});
</script>

</body>
</html>
