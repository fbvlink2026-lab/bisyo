name: Build APK — Proyekto ni Mark Jann Tampok
on:
  push: { branches: [main] }
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions: write-all
    outputs:
      build_status: ${{ steps.final-result.outputs.STATUS }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # ⚡ KUNG MAYROON NANG gradlew — DERETSO NA LANG
      - name: ⚡ Check Gradle Wrapper
        id: wrapper-check
        run: |
          if [ -f "./gradlew" ] && [ -x "./gradlew" ]; then
            echo "✅ gradlew NANDOON NA — lalaktaw ang Gradle setup"
            echo "HAS_WRAPPER=true" >> $GITHUB_ENV
          else
            echo "⚠️ WALANG gradlew — ise-setup ang Gradle"
            echo "HAS_WRAPPER=false" >> $GITHUB_ENV
          fi

      - name: Setup Gradle 8.2 (KUNG KULANG LANG)
        if: env.HAS_WRAPPER == 'false'
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.2-bin.zip -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          export PATH=/tmp/gradle-8.2/bin:$PATH
          gradle wrapper --gradle-version 8.2
          chmod +x gradlew

      - name: Siguraduhing Pwede ang gradlew
        run: chmod +x ./gradlew 2>/dev/null || true

      # ==========================================
      # ✅ KOPYAHIN LAHAT — BURAHIN LUNA → KOPYA BAGO
      # ==========================================
      - name: 📤 Kopyahin BUONG Assets papunta sa /docs — SIGURADONG PALIT
        run: |
          ASSETS_DIR="app/src/main/assets"
          DOCS_DIR="./docs"

          echo "=== ✅ BURAHIN BUONG docs/ — WALANG LUMANG MATITIRA ==="
          rm -rf "$DOCS_DIR"
          mkdir -p "$DOCS_DIR"

          echo "=== 📤 KOPYAHIN BUONG assets/ → /docs ==="
          cp -r "$ASSETS_DIR"/. "$DOCS_DIR"/

          echo ""
          echo "=== 📂 BAGONG LAMAN NG docs/ ==="
          ls -la "$DOCS_DIR"

          if [ -d "$DOCS_DIR/pages" ]; then
            echo ""
            echo "=== 📄 LAMAN NG pages/ ==="
            ls -la "$DOCS_DIR/pages"
          fi

          echo ""
          echo "✅ TAPOS — LAHAT BAGONG KOPYA MULA assets/"

      # ==========================================
      # 🔨 BUUIN ANG APK + KUNIN ANG LOG
      # ==========================================
      - name: 🔨 Buuin ang APK
        id: build-step
        run: |
          mkdir -p /tmp
          LOG_FILE="/tmp/build-full.log"
          STATUS_FILE="/tmp/build-status.txt"

          set +e
          ./gradlew assembleDebug > "$LOG_FILE" 2>&1
          EXIT_CODE=$?
          set -e

          if [ $EXIT_CODE -eq 0 ]; then
            echo "SUCCESS" > "$STATUS_FILE"
            echo "✅ BUILD SUCCESSFUL"
          else
            echo "FAILED" > "$STATUS_FILE"
            echo "❌ BUILD FAILED — Exit Code: $EXIT_CODE"
          fi

          echo "EXIT_CODE=$EXIT_CODE" >> $GITHUB_ENV

      # ==========================================
      # 📤 HANAPIN ANG APK → ILAGAY SA /docs
      # ==========================================
      - name: 📤 Hanapin at Ihanda ang APK
        id: apk-step
        run: |
          APK_FILE=$(find . -name "app-debug.apk" -path "*/build/*" | head -1)

          if [ -n "$APK_FILE" ] && [ -f "$APK_FILE" ]; then
            APK_SIZE=$(du -h "$APK_FILE" | cut -f1)
            APK_SIZE_BYTES=$(stat -c%s "$APK_FILE")
            NEW_NAME="Proyekto-ni-Mark-Jann-Tampok-v1.0.apk"

            cp "$APK_FILE" "docs/$NEW_NAME"
            cp "$APK_FILE" "$NEW_NAME"

            echo "✅ APK MATAGPUAN: docs/$NEW_NAME"
            echo "📏 Laki: $APK_SIZE ($APK_SIZE_BYTES bytes)"
            echo "APK_FOUND=true" >> $GITHUB_ENV
            echo "APK_SIZE=$APK_SIZE" >> $GITHUB_ENV
            echo "APK_PATH=docs/$NEW_NAME" >> $GITHUB_ENV
            echo "APK_NAME=$NEW_NAME" >> $GITHUB_ENV
          else
            echo "❌ HINDI MATAGPUAN ANG APK"
            echo "APK_FOUND=false" >> $GITHUB_ENV
          fi

      # ==========================================
      # 📄 ISULAT SA errors.md
      # ==========================================
      - name: 📄 Isulat ang Resulta sa errors.md
        id: write-log
        if: always()
        run: |
          DATE=$(date "+%Y-%m-%d %H:%M:%S UTC")
          STATUS_FILE="/tmp/build-status.txt"
          LOG_FILE="/tmp/build-full.log"

          if [ -f "$STATUS_FILE" ] && [ "$(cat $STATUS_FILE)" = "SUCCESS" ]; then
            STATUS_DISPLAY="✅ TAGUMPAY"
            STATUS_DETAIL="Matagumpay na nabuo ang APK"
          else
            STATUS_DISPLAY="❌ NABIGO"
            STATUS_DETAIL="Hindi nabuo ang APK — tingnan ang log sa ibaba"
          fi

          {
            echo "# 📋 Talaan ng Pagbuo — Proyekto ni Mark Jann Tampok"
            echo ""
            echo "---"
            echo "📅 **Petsa:** $DATE"
            echo "🎯 **Katayuan:** $STATUS_DISPLAY"
            echo "📝 **Detalye:** $STATUS_DETAIL"
            if [ "${{ env.APK_FOUND }}" = "true" ]; then
              echo "📦 **APK:** ${{ env.APK_NAME }}"
              echo "📏 **Laki:** ${{ env.APK_SIZE }}"
              echo "📂 **Lokasyon:** ${{ env.APK_PATH }}"
            fi
            echo "---"
            echo ""
            echo "## 📋 Buong Log ng Pagbuo"
            echo "\`\`\`"
            if [ -f "$LOG_FILE" ]; then
              cat "$LOG_FILE"
            else
              echo "(Walang nakuhang log)"
            fi
            echo "\`\`\`"
            echo ""
            echo "---"
            echo "✅ **Katapusan ng Talaan**"
          } > errors.md

          echo "✅ errors.md naisulat na!"

      # ==========================================
      # 📤 I-UPLOAD
      # ==========================================
      - name: 📤 I-upload ang APK
        if: env.APK_FOUND == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Bisyo-APK-v1.0
          path: docs/*.apk
          retention-days: 30

      - name: 📤 I-upload ang errors.md
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Build-Logs
          path: errors.md
          retention-days: 30

      # ==========================================
      # ✅ I-COMMIT — SIGURADUHING MAIPUSH
      # ==========================================
      - name: ✅ I-commit at I-push ang Resulta
        if: always()
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add docs/ errors.md 2>/dev/null || true

          if git diff --staged --quiet; then
            echo "ℹ️ Walang pagbabago — walang i-commit"
          else
            git commit -m "📋 Build Result: $(date +%Y-%m-%d)"
            echo "📤 Ipinapadala sa GitHub..."
            git push
            if [ $? -eq 0 ]; then
              echo "✅ MATAGUMPAY NAIPUSH!"
            else
              echo "⚠️ Retry with force..."
              git push --force
            fi
          fi

      # ==========================================
      # ✅ KONKLUSYON
      # ==========================================
      - name: ✅ Resulta ng Pagbuo
        id: final-result
        if: always()
        run: |
          if [ "${{ env.APK_FOUND }}" = "true" ]; then
            echo "✅ TAGUMPAY — docs/ updated + APK ready"
            echo "STATUS=SUCCESS" >> $GITHUB_OUTPUT
          else
            echo "❌ NABIGO — Tingnan ang errors.md"
            echo "STATUS=FAILED" >> $GITHUB_OUTPUT
            exit 1
          fi
