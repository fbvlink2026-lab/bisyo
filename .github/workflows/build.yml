name: Build APK — Proyekto ni Mark Jann Tampok
on:
  push: { branches: [main] }
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions: write-all
    outputs:
      build_status: ${{ steps.final-result.outputs.STATUS }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # ==========================================
      # ⬆️ HAKBANG 0 — AWTO TAASIN ANG VERSION
      # ==========================================
      - name: ⬆️ Basahin at Taasan ang Bersyon
        id: version
        run: |
          FILE=versionCode.txt
          if [ ! -f "$FILE" ]; then echo "1" > "$FILE"; fi
          CURRENT=$(cat "$FILE")
          NEXT=$((CURRENT + 1))
          echo "$NEXT" > "$FILE"
          VERSION_NAME="1.0.$NEXT"
          echo "VERSION_CODE=$NEXT" >> $GITHUB_OUTPUT
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "✅ Bersyon: $CURRENT → $VERSION_NAME ($NEXT)"

      # ⚡ Check Gradle Wrapper
      - name: ⚡ Check Gradle Wrapper
        id: wrapper-check
        run: |
          if [ -f "./gradlew" ] && [ -x "./gradlew" ]; then
            echo "✅ gradlew NANDOON NA"
            echo "HAS_WRAPPER=true" >> $GITHUB_ENV
          else
            echo "⚠️ WALANG gradlew"
            echo "HAS_WRAPPER=false" >> $GITHUB_ENV
          fi

      - name: Setup Gradle 8.2 (KUNG KULANG LANG)
        if: env.HAS_WRAPPER == 'false'
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.2-bin.zip -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          export PATH=/tmp/gradle-8.2/bin:$PATH
          gradle wrapper --gradle-version 8.2
          chmod +x gradlew

      - name: Siguraduhing Pwede ang gradlew
        run: chmod +x ./gradlew 2>/dev/null || true

      # ==========================================
      # 🔨 HAKBANG 1 — BUUIN ANG APK
      # ==========================================
      - name: 🔨 Buuin ang APK
        id: build-step
        run: |
          mkdir -p /tmp
          LOG_FILE="/tmp/build-full.log"
          STATUS_FILE="/tmp/build-status.txt"

          set +e
          ./gradlew assembleDebug > "$LOG_FILE" 2>&1
          EXIT_CODE=$?
          set -e

          if [ $EXIT_CODE -eq 0 ]; then
            echo "SUCCESS" > "$STATUS_FILE"
            echo "✅ BUILD SUCCESSFUL"
          else
            echo "FAILED" > "$STATUS_FILE"
            echo "❌ BUILD FAILED — Exit Code: $EXIT_CODE"
          fi
          echo "EXIT_CODE=$EXIT_CODE" >> $GITHUB_ENV

      # ==========================================
      # 📄 HAKBANG 2 — BURAHIN → ISULAT BAGONG errors.md
      # ==========================================
      - name: 📄 Burahin Luma → Isulat BAGONG errors.md sa assets/
        id: write-log
        if: always()
        run: |
          DATE=$(date "+%Y-%m-%d %H:%M:%S UTC")
          STATUS_FILE="/tmp/build-status.txt"
          LOG_FILE="/tmp/build-full.log"
          ASSETS_DIR="app/src/main/assets"
          TARGET_FILE="$ASSETS_DIR/errors.md"

          mkdir -p "$ASSETS_DIR"

          if [ -f "$TARGET_FILE" ]; then
            rm -f "$TARGET_FILE"
            echo "🗑️ BINURA ANG LUMANG errors.md"
          fi

          if [ -f "$STATUS_FILE" ] && [ "$(cat $STATUS_FILE)" = "SUCCESS" ]; then
            STATUS_DISPLAY="✅ TAGUMPAY"
            STATUS_DETAIL="Matagumpay na nabuo ang APK — Bersyon v${{ steps.version.outputs.VERSION_NAME }}"
          else
            STATUS_DISPLAY="❌ NABIGO"
            STATUS_DETAIL="Hindi nabuo ang APK — tingnan ang log sa ibaba"
          fi

          {
            echo "# 📋 Talaan ng Pagbuo — Proyekto ni Mark Jann Tampok"
            echo ""
            echo "---"
            echo "📅 **Petsa:** $DATE"
            echo "🏷️ **Bersyon:** v${{ steps.version.outputs.VERSION_NAME }} (${{ steps.version.outputs.VERSION_CODE }})"
            echo "🎯 **Katayuan:** $STATUS_DISPLAY"
            echo "📝 **Detalye:** $STATUS_DETAIL"
            echo "---"
            echo ""
            echo "## 📋 Buong Log ng Pagbuo"
            echo "\`\`\`"
            if [ -f "$LOG_FILE" ]; then
              cat "$LOG_FILE"
            else
              echo "(Walang nakuhang log)"
            fi
            echo "\`\`\`"
            echo ""
            echo "---"
            echo "✅ **Katapusan ng Talaan**"
          } > "$TARGET_FILE"

          echo "✅ BAGONG errors.md NAISULAT SA: $TARGET_FILE"

      # ==========================================
      # 📤 HAKBANG 3 — KOPYAHIN BUONG assets/ → docs/
      # ==========================================
      - name: 📤 Kopyahin BUONG Assets papunta sa /docs
        run: |
          ASSETS_DIR="app/src/main/assets"
          DOCS_DIR="./docs"
          rm -rf "$DOCS_DIR"
          mkdir -p "$DOCS_DIR"
          cp -R "$ASSETS_DIR"/. "$DOCS_DIR/"
          echo "✅ NA-KOPYA LAHAT NG assets/ → docs/"

      # ==========================================
      # 📤 HAKBANG 4 — ILAGAY ANG APK SA docs/ ✅ TAMANG PANGALAN
      # ==========================================
      - name: 📤 Hanapin at Ihanda ang APK
        id: apk-step
        run: |
          APK_FILE=$(find . -name "app-debug.apk" -path "*/build/*" | head -1)

          if [ -n "$APK_FILE" ] && [ -f "$APK_FILE" ]; then
            VERSION_NAME="${{ steps.version.outputs.VERSION_NAME }}"
            VERSION_CODE="${{ steps.version.outputs.VERSION_CODE }}"
            NEW_NAME="Proyekto-ni-Mark-Jann-Tampok-v${VERSION_NAME}(${VERSION_CODE}).apk"

            cp "$APK_FILE" "docs/$NEW_NAME"

            echo "✅ APK: docs/$NEW_NAME"
            echo "APK_FOUND=true" >> $GITHUB_ENV
            echo "APK_NAME=$NEW_NAME" >> $GITHUB_ENV
          else
            echo "❌ HINDI MATAGPUAN ANG APK"
            echo "APK_FOUND=false" >> $GITHUB_ENV
          fi

      # ==========================================
      # ✅ I-UPLOAD ANG APK
      # ==========================================
      - name: 📤 I-upload ang APK
        if: env.APK_FOUND == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: "Bisyo-APK-v${{ steps.version.outputs.VERSION_NAME }}"
          path: docs/*.apk
          retention-days: 30

      # ==========================================
      # ✅ I-COMMIT — KASAMA ANG BAGONG VERSION + APK
      # ==========================================
      - name: ✅ I-commit at I-push ang LAHAT
        if: always()
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add versionCode.txt app/src/main/assets/ docs/ 2>/dev/null || true

          if git diff --staged --quiet; then
            echo "ℹ️ WALANG PAGBABAGO"
          else
            git commit -m "📋 Bersyon v${{ steps.version.outputs.VERSION_NAME }} — Build: $(date +%Y-%m-%d %H:%M)"
            git push
            echo "✅ NA-COMMIT — Bersyon v${{ steps.version.outputs.VERSION_NAME }}"
          fi

      # ==========================================
      # ✅ KONKLUSYON
      # ==========================================
      - name: ✅ Resulta ng Pagbuo
        id: final-result
        if: always()
        run: |
          if [ "${{ env.APK_FOUND }}" = "true" ]; then
            echo "✅ TAGUMPAY — Bersyon v${{ steps.version.outputs.VERSION_NAME }}"
            echo "STATUS=SUCCESS" >> $GITHUB_OUTPUT
          else
            echo "❌ NABIGO — WALANG APK"
            echo "STATUS=FAILED" >> $GITHUB_OUTPUT
            exit 1
          fi
