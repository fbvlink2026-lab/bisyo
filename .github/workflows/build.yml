name: Build APK — Proyekto ni Mark Jann Tampok
on:
  push: { branches: [main] }
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions: write-all
    outputs:
      build_status: ${{ steps.final-result.outputs.STATUS }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # ⚡ KUNG MAYROON NANG gradlew — DERETSO NA LANG
      - name: ⚡ Check Gradle Wrapper
        id: wrapper-check
        run: |
          if [ -f "./gradlew" ] && [ -x "./gradlew" ]; then
            echo "✅ gradlew NANDOON NA"
            echo "HAS_WRAPPER=true" >> $GITHUB_ENV
          else
            echo "⚠️ WALANG gradlew"
            echo "HAS_WRAPPER=false" >> $GITHUB_ENV
          fi

      - name: Setup Gradle 8.2 (KUNG KULANG LANG)
        if: env.HAS_WRAPPER == 'false'
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.2-bin.zip -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          export PATH=/tmp/gradle-8.2/bin:$PATH
          gradle wrapper --gradle-version 8.2
          chmod +x gradlew

      - name: Siguraduhing Pwede ang gradlew
        run: chmod +x ./gradlew 2>/dev/null || true

      # ==========================================
      # 🔨 HAKBANG 1 — BUUIN ANG APK
      # ==========================================
      - name: 🔨 Buuin ang APK
        id: build-step
        run: |
          mkdir -p /tmp
          LOG_FILE="/tmp/build-full.log"
          STATUS_FILE="/tmp/build-status.txt"

          set +e
          ./gradlew assembleDebug > "$LOG_FILE" 2>&1
          EXIT_CODE=$?
          set -e

          if [ $EXIT_CODE -eq 0 ]; then
            echo "SUCCESS" > "$STATUS_FILE"
            echo "✅ BUILD SUCCESSFUL"
          else
            echo "FAILED" > "$STATUS_FILE"
            echo "❌ BUILD FAILED — Exit Code: $EXIT_CODE"
          fi
          echo "EXIT_CODE=$EXIT_CODE" >> $GITHUB_ENV

      # ==========================================
      # 📄 HAKBANG 2 — BURAHIN → ISULAT BAGONG errors.md
      # ==========================================
      - name: 📄 Burahin Luma → Isulat BAGONG errors.md sa assets/
        id: write-log
        if: always()
        run: |
          DATE=$(date "+%Y-%m-%d %H:%M:%S UTC")
          STATUS_FILE="/tmp/build-status.txt"
          LOG_FILE="/tmp/build-full.log"
          ASSETS_DIR="app/src/main/assets"
          TARGET_FILE="$ASSETS_DIR/errors.md"

          mkdir -p "$ASSETS_DIR"

          # ✅ BURAHIN MUNA — SIGURADONG MAY PAGBABAGO
          if [ -f "$TARGET_FILE" ]; then
            rm -f "$TARGET_FILE"
            echo "🗑️ BINURA ANG LUMANG errors.md"
          fi

          if [ -f "$STATUS_FILE" ] && [ "$(cat $STATUS_FILE)" = "SUCCESS" ]; then
            STATUS_DISPLAY="✅ TAGUMPAY"
            STATUS_DETAIL="Matagumpay na nabuo ang APK"
          else
            STATUS_DISPLAY="❌ NABIGO"
            STATUS_DETAIL="Hindi nabuo ang APK — tingnan ang log sa ibaba"
          fi

          # ✅ ISULAT ANG BAGONG FILE
          {
            echo "# 📋 Talaan ng Pagbuo — Proyekto ni Mark Jann Tampok"
            echo ""
            echo "---"
            echo "📅 **Petsa:** $DATE"
            echo "🎯 **Katayuan:** $STATUS_DISPLAY"
            echo "📝 **Detalye:** $STATUS_DETAIL"
            echo "---"
            echo ""
            echo "## 📋 Buong Log ng Pagbuo"
            echo "\`\`\`"
            if [ -f "$LOG_FILE" ]; then
              cat "$LOG_FILE"
            else
              echo "(Walang nakuhang log)"
            fi
            echo "\`\`\`"
            echo ""
            echo "---"
            echo "✅ **Katapusan ng Talaan**"
          } > "$TARGET_FILE"

          echo "✅ BAGONG errors.md NAISULAT SA: $TARGET_FILE"

      # ==========================================
      # 📤 HAKBANG 3 — KOPYAHIN BUONG assets/ → docs/ ✅ WALANG INILILIKO — LAHAT KASAMA
      # ==========================================
      - name: 📤 Kopyahin BUONG Assets papunta sa /docs — LAHAT KASAMA
        run: |
          ASSETS_DIR="app/src/main/assets"
          DOCS_DIR="./docs"

          echo "=== 📂 LAMAN NG assets/ BAGO KOPYAHIN ==="
          ls -la "$ASSETS_DIR"
          echo ""

          echo "=== ✅ BURAHIN BUONG docs/ ==="
          rm -rf "$DOCS_DIR"
          mkdir -p "$DOCS_DIR"

          echo "=== 📤 KOPYAHIN BUONG assets/ → docs/ — WALANG INILILIKO ==="
          cp -R "$ASSETS_DIR"/. "$DOCS_DIR/"

          echo ""
          echo "=== ✅ LAMAN NG docs/ ==="
          ls -la "$DOCS_DIR"

          if [ -f "$DOCS_DIR/errors.md" ]; then
            echo "✅✅✅ BAGONG errors.md NAKOPYA — SIGURADO!"
          fi
          if [ -f "$DOCS_DIR/setup-token.html" ]; then
            echo "✅✅✅ setup-token.html NAKOPYA — KASAMA PALAGI!"
          fi

      # ==========================================
      # 📤 HAKBANG 4 — ILAGAY ANG APK SA docs/
      # ==========================================
      - name: 📤 Hanapin at Ihanda ang APK
        id: apk-step
        run: |
          APK_FILE=$(find . -name "app-debug.apk" -path "*/build/*" | head -1)

          if [ -n "$APK_FILE" ] && [ -f "$APK_FILE" ]; then
            APK_SIZE=$(du -h "$APK_FILE" | cut -f1)
            APK_SIZE_BYTES=$(stat -c%s "$APK_FILE")
            NEW_NAME="Proyekto-ni-Mark-Jann-Tampok-v1.0.apk"

            cp "$APK_FILE" "docs/$NEW_NAME"

            echo "✅ APK MATAGPUAN: docs/$NEW_NAME"
            echo "APK_FOUND=true" >> $GITHUB_ENV
            echo "APK_SIZE=$APK_SIZE" >> $GITHUB_ENV
            echo "APK_PATH=docs/$NEW_NAME" >> $GITHUB_ENV
            echo "APK_NAME=$NEW_NAME" >> $GITHUB_ENV
          else
            echo "❌ HINDI MATAGPUAN ANG APK"
            echo "APK_FOUND=false" >> $GITHUB_ENV
          fi

      # ==========================================
      # ✅ I-UPLOAD ANG APK
      # ==========================================
      - name: 📤 I-upload ang APK
        if: env.APK_FOUND == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Bisyo-APK-v1.0
          path: docs/*.apk
          retention-days: 30

      # ==========================================
      # ✅ I-COMMIT — LAGING GAGANA
      # ==========================================
      - name: ✅ I-commit at I-push ang LAHAT
        if: always()
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add app/src/main/assets/ docs/ 2>/dev/null || true

          if git diff --staged --quiet; then
            echo "ℹ️ WALANG PAGBABAGO"
          else
            git commit -m "📋 Build Result: $(date +%Y-%m-%d %H:%M)"
            echo "📤 IPINAPADALA..."
            git push || git push --force
            echo "✅ MATAGUMPAY — SABAY-SABAY ANG LAHAT!"
          fi

      # ==========================================
      # ✅ KONKLUSYON — PULA KUNG WALANG APK
      # ==========================================
      - name: ✅ Resulta ng Pagbuo
        id: final-result
        if: always()
        run: |
          if [ "${{ env.APK_FOUND }}" = "true" ]; then
            echo "✅ TAGUMPAY — May APK, nakopya ang lahat ng assets"
            echo "STATUS=SUCCESS" >> $GITHUB_OUTPUT
          else
            echo "❌ NABIGO — WALANG APK DAHIL MAY ERROR SA BUILD"
            echo "STATUS=FAILED" >> $GITHUB_OUTPUT
            exit 1
          fi
